name: Offline AI POC Build

on:
  push:
    branches:
      - offline-ai/source-layout-audit
    paths:
      - "offline-ai-poc/**"
      - ".github/workflows/offline-ai-poc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-poc:
    name: Build isolated LiteRT-LM POC
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify preinstalled Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms"
          echo "Android SDK: $ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build POC debug APK
        run: gradle -p offline-ai-poc :app:assembleDebug --stacktrace

      - name: Upload POC APK
        uses: actions/upload-artifact@v4
        with:
          name: M-Asisten-Offline-AI-POC
          path: offline-ai-poc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
