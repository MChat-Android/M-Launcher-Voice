      - name: Configure Firebase Android
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
            python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("app/google-services.json").read_text())
          packages = [c.get("client_info", {}).get("android_client_info", {}).get("package_name") for c in config.get("client", [])]
          if "com.m.launchervoice" not in packages:
              raise SystemExit("Firebase config tidak memiliki package com.m.launchervoice")
          print("Firebase config valid untuk M Asisten.")
          PY
          else
            echo "Secret Firebase belum dipasang; build tetap berjalan tanpa konfigurasi Firebase."
          fi

      - name: Validate M Asisten Launcher Artwork
        run: |
          set -euo pipefail
          test -s launcher_icon.png
          file launcher_icon.png

      - name: Generate Launcher Icons
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageChops
          from pathlib import Path

          source = Path("launcher_icon.png")

          if not source.exists():
              raise SystemExit("launcher_icon.png tidak ditemukan!")

          image = Image.open(source).convert("RGBA")

          # Pangkas sumber menjadi persegi penuh.
          side = min(image.size)
          left = (image.width - side) // 2
          top = (image.height - side) // 2
          image = image.crop((left, top, left + side, top + side))

          # Buat area di luar emblem lingkaran transparan. Isi hitam di dalam
          # lingkaran tetap dipertahankan agar logo, teks, dan efek neon tidak berubah.
          scale = 4
          mask = Image.new("L", (side * scale, side * scale), 0)
          draw = ImageDraw.Draw(mask)
          draw.ellipse((0, 0, side * scale - 1, side * scale - 1), fill=255)
          mask = mask.resize((side, side), Image.Resampling.LANCZOS)
          image.putalpha(ImageChops.multiply(image.getchannel("A"), mask))

          # Sumber resolusi tinggi untuk logo halaman beranda.
          home_icon_dir = Path("app/src/main/res/drawable-nodpi")
          home_icon_dir.mkdir(parents=True, exist_ok=True)
          image.save(home_icon_dir / "launcher_home.png", optimize=True)

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192,
          }

          for density, size in sizes.items():
              folder = Path("app/src/main/res") / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              resized = image.resize((size, size), Image.Resampling.LANCZOS)

              resized.save(folder / "ic_launcher.png", optimize=True)
          PY

      - name: Decode Release Keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEYSTORE_BASE64"
          test -n "$SIGNING_STORE_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mlauncher-release.jks"
          test -s "$RUNNER_TEMP/mlauncher-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/mlauncher-release.jks" -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS"

      - name: Build Signed Release APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/mlauncher-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Verify APK Signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

      - name: Prepare Download Filename
        run: |
          cp app/build/outputs/apk/release/app-release.apk masisten.apk
          test -s masisten.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: M-Asisten-APK
          path: masisten.apk
          if-no-files-found: error
