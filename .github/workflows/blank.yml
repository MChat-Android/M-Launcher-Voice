          cat > app/src/main/java/com/m/launchervoice/FloatingVoiceService.kt <<'EOF'
          package com.m.launchervoice

          import android.app.*
          import android.Manifest
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.hardware.camera2.CameraCharacteristics
          import android.hardware.camera2.CameraManager
          import android.media.AudioManager
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.provider.Settings
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.graphics.drawable.GradientDrawable
          import java.util.Locale

          class FloatingVoiceService : Service() {

              private lateinit var windowManager: WindowManager
              private lateinit var container: LinearLayout
              private lateinit var micButton: TextView
              private lateinit var prompt: TextView
              private var speechRecognizer: SpeechRecognizer? = null
              private val handler = Handler(Looper.getMainLooper())
              private var listening = false

              private lateinit var layoutParams: WindowManager.LayoutParams

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  createNotification()
                  createOverlay()
              }

              override fun onStartCommand(
                  intent: Intent?,
                  flags: Int,
                  startId: Int
              ): Int {
                  return START_STICKY
              }

              private fun createNotification() {
                  val channelId = "m_launcher_voice_channel"

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          channelId,
                          "M Asisten",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      val manager =
                          getSystemService(NotificationManager::class.java)
                      manager.createNotificationChannel(channel)
                  }

                  val notification = Notification.Builder(this, channelId)
                      .setContentTitle("M Asisten aktif")
                      .setContentText("Widget mikrofon sedang berjalan")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setOngoing(true)
                      .build()

                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(
                          10,
                          notification,
                          android.content.pm.ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE
                      )
                  } else {
                      startForeground(10, notification)
                  }
              }

              private fun createOverlay() {
                  if (!Settings.canDrawOverlays(this)) {
                      stopSelf()
                      return
                  }

                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager

                  container = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(12, 8, 12, 8)
                      background = roundedBackground(0xEE102B50.toInt(), 24)
                  }

                  prompt = TextView(this).apply {
                      text = "Silakan ucapkan perintah"
                      setTextColor(Color.WHITE)
                      textSize = 13f
                      typeface = Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                      visibility = View.GONE
                      setPadding(8, 4, 8, 10)
                  }

                  micButton = TextView(this).apply {
                      text = "🎙️"
                      textSize = 27f
                      gravity = Gravity.CENTER
                      setTextColor(Color.WHITE)
                      background = roundedBackground(0xFF1769D2.toInt(), 100)
                      setPadding(15, 10, 15, 10)
                      setOnClickListener {
                          startVoiceRecognition()
                      }
                  }

                  container.addView(prompt)
                  container.addView(
                      micButton,
                      LinearLayout.LayoutParams(62, 62)
                  )

                  layoutParams = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      if (Build.VERSION.SDK_INT >= 26)
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                      else
                          WindowManager.LayoutParams.TYPE_PHONE,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 20
                      y = 250
                  }

                  try {
                      windowManager.addView(container, layoutParams)
                      enableDragging()
                  } catch (e: Exception) {
                      stopSelf()
                  }
              }

              private fun roundedBackground(color: Int, radius: Int): GradientDrawable {
                  return GradientDrawable().apply {
                      setColor(color)
                      cornerRadius = radius.toFloat()
                  }
              }

              private fun enableDragging() {
              val closeTarget = TextView(this).apply {
              text = "✕"
              textSize = 28f
              gravity = Gravity.CENTER
              setTextColor(Color.WHITE)
              background = roundedBackground(0xFFE53935.toInt(), 100)
              elevation = 20f
              }

              val closeParams = WindowManager.LayoutParams(
              68,
              68,
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
              WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
              else
              WindowManager.LayoutParams.TYPE_PHONE,
              WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
              WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE,
              PixelFormat.TRANSLUCENT
              ).apply {
              gravity = Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL
              y = 36
              }

              var startX = 0
              var startY = 0
              var touchX = 0f
              var touchY = 0f
              var moved = false
              var targetVisible = false

              fun showTarget() {
              if (targetVisible) return
              try {
              windowManager.addView(closeTarget, closeParams)
              targetVisible = true
              } catch (_: Exception) {}
              }

              fun hideTarget() {
              if (!targetVisible) return
              try {
              windowManager.removeView(closeTarget)
              } catch (_: Exception) {}
              targetVisible = false
              }

              fun handleDrag(event: MotionEvent): Boolean {
              when (event.action) {
            MotionEvent.ACTION_DOWN -> {
                startX = layoutParams.x
                startY = layoutParams.y
                touchX = event.rawX
                touchY = event.rawY
                moved = false
                showTarget()
                return true
            }

            MotionEvent.ACTION_MOVE -> {
                val dx = (event.rawX - touchX).toInt()
                val dy = (event.rawY - touchY).toInt()

                if (kotlin.math.abs(dx) > 8 ||
                    kotlin.math.abs(dy) > 8
                ) {
                    moved = true
                }

                if (moved) {
                    layoutParams.x = (startX + dx).coerceAtLeast(0)
                    layoutParams.y = (startY + dy).coerceAtLeast(0)

                    try {
                        windowManager.updateViewLayout(
                            container,
                            layoutParams
                        )
                    } catch (_: Exception) {}
                }
                return true
            }

            MotionEvent.ACTION_UP -> {
                val metrics = resources.displayMetrics
                val widgetX = layoutParams.x + container.width / 2
                val widgetY = layoutParams.y + container.height / 2
                val targetX = metrics.widthPixels / 2
                val targetY = metrics.heightPixels - closeParams.y - 34

                val dismiss = moved &&
                    kotlin.math.abs(widgetX - targetX) < 90 &&
                    kotlin.math.abs(widgetY - targetY) < 90

                hideTarget()

                if (dismiss) {
                    stopSelf()
                } else if (!moved) {
                    startVoiceRecognition()
                }
                return true
            }

            MotionEvent.ACTION_CANCEL -> {
                hideTarget()
                return true
            }
            }
            return true
            }

            container.setOnTouchListener { _, event ->
            handleDrag(event)
            }

            micButton.setOnTouchListener { _, event ->
            handleDrag(event)
            }
            }

              private fun startVoiceRecognition() {
                  if (listening) return

                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      showMessage("Pengenalan suara tidak tersedia")
                      return
                  }

                  try {
                      speechRecognizer?.destroy()
                      speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this)

                      speechRecognizer?.setRecognitionListener(
                          object : RecognitionListener {
                              override fun onReadyForSpeech(params: android.os.Bundle?) {
                                  showMessage("Silakan ucapkan perintah")
                              }

                              override fun onBeginningOfSpeech() {
                                  showMessage("Mendengarkan...")
                              }

                              override fun onRmsChanged(rmsdB: Float) {}
                              override fun onBufferReceived(buffer: ByteArray?) {}
                              override fun onEndOfSpeech() {
                                  showMessage("Memproses perintah...")
                              }

                              override fun onError(error: Int) {
                                  listening = false
                                  showMessage("Tidak terdengar, tekan mic lagi")
                                  resetAfterDelay()
                              }

                              override fun onResults(results: android.os.Bundle?) {
                                  listening = false
                                  val words = results?.getStringArrayList(
                                      SpeechRecognizer.RESULTS_RECOGNITION
                                  )?.firstOrNull()

                                  if (!words.isNullOrBlank()) {
                                      showMessage("Perintah: $words")
                                      executeCommand(words)
                                  } else {
                                      showMessage("Perintah tidak dikenali")
                                  }
                                  resetAfterDelay()
                              }

                              override fun onPartialResults(
                                  partialResults: android.os.Bundle?
                              ) {
                                  val words = partialResults?.getStringArrayList(
                                      SpeechRecognizer.RESULTS_RECOGNITION
                                  )?.firstOrNull()
                                  if (!words.isNullOrBlank()) {
                                      showMessage(words)
                                  }
                              }

                              override fun onEvent(
                                  eventType: Int,
                                  params: android.os.Bundle?
                              ) {}
                          }
                      )

                      val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                          putExtra(
                              RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                              RecognizerIntent.LANGUAGE_MODEL_FREE_FORM
                          )
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE, Locale.getDefault().toLanguageTag())
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE_PREFERENCE, Locale.getDefault().toLanguageTag())
                          putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 1)
                          putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                      }

                      listening = true
                      showMessage("Silakan ucapkan perintah")
                      speechRecognizer?.startListening(intent)

                  } catch (e: Exception) {
                      listening = false
                      showMessage("Mikrofon tidak dapat diaktifkan")
                  }
              }

              private fun showMessage(message: String) {
                  handler.post {
                      if (::prompt.isInitialized) {
                          prompt.text = message
                          prompt.visibility = View.VISIBLE
                      }
                  }
              }

              private fun resetAfterDelay() {
                  handler.postDelayed({
                      if (!listening && ::prompt.isInitialized) {
                          prompt.visibility = View.GONE
                      }
                  }, 3500)
              }

              private fun executeCommand(command: String) {
                  val text = command.lowercase()
                      .replace("tolong", "")
                      .replace("silakan", "")
                      .replace("please", "")
                      .replace("buka", "")
                      .replace("open", "")
                      .replace("launch", "")
                      .replace("jalankan", "")
                      .replace("start", "")
                      .trim()

                  if (text.contains("senter") ||
                      text.contains("flashlight") ||
                      text.contains("flash")
                  ) {
                      when {
                          text.contains("matikan") ||
                          text.contains("nonaktifkan") ||
                          text.contains("padamkan") ||
                          text.contains("turn off") ||
                          text.contains("switch off") -> controlTorch(false)

                          text.contains("nyalakan") ||
                          text.contains("hidupkan") ||
                          text.contains("aktifkan") ||
                          text.contains("turn on") ||
                          text.contains("switch on") -> controlTorch(true)

                          else -> showMessage("Ucapkan nyalakan senter atau matikan senter")
                      }
                      return
                  }

                  if (text.contains("wifi") || text.contains("wi-fi")) {
                      openSettings(Settings.ACTION_WIFI_SETTINGS)
                      return
                  }

                  if (text.contains("bluetooth")) {
                      openSettings(Settings.ACTION_BLUETOOTH_SETTINGS)
                      return
                  }

                  if (text.contains("hotspot") ||
                      text.contains("hot spot") ||
                      text.contains("tethering")
                  ) {
                      openSettings(Settings.ACTION_WIRELESS_SETTINGS)
                      return
                  }

                  if (text.contains("volume") || text.contains("suara")) {
                      val audio = getSystemService(AUDIO_SERVICE) as AudioManager

                      when {
                          text.contains("naik") || text.contains("besar") ||
                          text.contains("keras") || text.contains("tambah") ||
                          text.contains("up") || text.contains("increase") ||
                          text.contains("louder") ->
                              audio.adjustStreamVolume(
                                  AudioManager.STREAM_MUSIC,
                                  AudioManager.ADJUST_RAISE,
                                  AudioManager.FLAG_SHOW_UI
                              )

                          text.contains("turun") || text.contains("kecil") ||
                          text.contains("kurangi") || text.contains("down") ||
                          text.contains("decrease") || text.contains("lower") ->
                              audio.adjustStreamVolume(
                                  AudioManager.STREAM_MUSIC,
                                  AudioManager.ADJUST_LOWER,
                                  AudioManager.FLAG_SHOW_UI
                              )

                          text.contains("diam") || text.contains("mute") ||
                          text.contains("silence") ->
                              audio.adjustStreamVolume(
                                  AudioManager.STREAM_MUSIC,
                                  AudioManager.ADJUST_MUTE,
                                  AudioManager.FLAG_SHOW_UI
                              )
                      }
                      return
                  }

                  if (text.contains("kecerahan") ||
                      text.contains("brightness")
                  ) {
                      openSettings(Settings.ACTION_DISPLAY_SETTINGS)
                      return
                  }

                  if (text.contains("menu utama") ||
                      text.contains("main screen") ||
                      text.contains("home screen") ||
                      text == "home" ||
                      text.contains("layar utama") ||
                      text.contains("halaman utama") ||
                      text == "home"
                  ) {
                      val intent = Intent(Intent.ACTION_MAIN).apply {
                          addCategory(Intent.CATEGORY_HOME)
                          flags = Intent.FLAG_ACTIVITY_NEW_TASK
                      }
                      startActivity(intent)
                      return
                  }

                  if (text.contains("video") || text.contains("rekam") || text.contains("record")) {
                      launchIntent(Intent("android.media.action.VIDEO_CAPTURE"))
                      return
                  }

                  if (text.contains("kamera") || text.contains("camera") || text == "foto" || text.contains("photo")) {
                      if (!openAppByName("kamera", "camera")) {
                          launchIntent(Intent("android.media.action.IMAGE_CAPTURE"))
                      }
                      return
                  }

                  if (text.contains("galeri") || text.contains("album") || text.contains("gallery")) {
                      if (!openAppByName("galeri", "gallery", "photos", "foto")) {
                          launchIntent(
                              Intent(Intent.ACTION_VIEW).apply {
                                  type = "image/*"
                              }
                          )
                      }
                      return
                  }

                  if (text.contains("telepon") ||
                      text.contains("panggilan") ||
                      text.contains("dialer") ||
                      text.contains("phone") ||
                      text.contains("call")
                  ) {
                      launchIntent(Intent(Intent.ACTION_DIAL))
                      return
                  }

                  if (text == "pesan" ||
                      text.contains("messages") ||
                      text.contains("message") ||
                      text.contains("sms") ||
                      text.contains("pesan")
                  ) {
                      launchIntent(
                          Intent(Intent.ACTION_MAIN).apply {
                              addCategory(Intent.CATEGORY_DEFAULT)
                              type = "vnd.android-dir/mms-sms"
                          }
                      )
                      return
                  }

                  if (text.contains("pengaturan") || text.contains("setelan") || text.contains("settings")) {
                      openSettings(Settings.ACTION_SETTINGS)
                      return
                  }

                  if (text.contains("lokasi") || text.contains("location")) {
                      openSettings(Settings.ACTION_LOCATION_SOURCE_SETTINGS)
                      return
                  }

                  if (text.contains("pesawat") || text.contains("airplane") || text.contains("flight mode")) {
                      openSettings(Settings.ACTION_AIRPLANE_MODE_SETTINGS)
                      return
                  }

                  val target = text
                      .replace("jalankan", "")
                      .replace("mulai", "")
                      .trim()

                  if (target.isNotBlank()) {
                      if (!openAppByName(target)) {
                          showMessage("Aplikasi $target tidak ditemukan")
                      }
                  } else {
                      showMessage("Perintah tidak dikenali")
                  }
              }

              private fun openSettings(action: String) {
                  try {
                      startActivity(
                          Intent(action).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      )
                  } catch (e: Exception) {
                      showMessage("Pengaturan tidak dapat dibuka")
                  }
              }

              private fun launchIntent(intent: Intent) {
                  try {
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      startActivity(intent)
                  } catch (e: Exception) {
                      showMessage("Aplikasi tidak ditemukan")
                  }
              }

              private fun openAppByName(vararg names: String): Boolean {
                  return try {
                      val intent = Intent(Intent.ACTION_MAIN).apply {
                          addCategory(Intent.CATEGORY_LAUNCHER)
                      }

                      val apps = packageManager.queryIntentActivities(intent, 0)

                      val matched = apps.firstOrNull { app ->
                          val label = app.loadLabel(packageManager)
                              .toString().lowercase()

                          app.activityInfo.packageName != packageName &&
                              names.any { label.contains(it.lowercase()) }
                      }

                      if (matched != null) {
                          val launch = packageManager.getLaunchIntentForPackage(
                              matched.activityInfo.packageName
                          )

                          if (launch != null) {
                              launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              startActivity(launch)
                              true
                          } else false
                      } else false
                  } catch (e: Exception) {
                      false
                  }
              }

              private fun controlTorch(turnOn: Boolean) {
                  if (checkSelfPermission(Manifest.permission.CAMERA)
                      != PackageManager.PERMISSION_GRANTED
                  ) {
                      showMessage("Izin kamera belum diberikan")
                      return
                  }

                  try {
                      val cameraManager =
                          getSystemService(CAMERA_SERVICE) as CameraManager

                      val cameraId = cameraManager.cameraIdList.firstOrNull {
                          cameraManager.getCameraCharacteristics(it).get(
                              CameraCharacteristics.FLASH_INFO_AVAILABLE
                          ) == true
                      }

                      if (cameraId == null) {
                          showMessage("Senter tidak tersedia")
                          return
                      }

                      cameraManager.setTorchMode(cameraId, turnOn)
                      showMessage(
                          if (turnOn) "Senter dinyalakan" else "Senter dimatikan"
                      )
                  } catch (e: Exception) {
                      showMessage("Senter tidak dapat digunakan")
                  }
              }

              override fun onDestroy() {
                  try {
                      speechRecognizer?.destroy()
                      speechRecognizer = null

                      if (::container.isInitialized) {
                          windowManager.removeView(container)
                      }
                  } catch (_: Exception) {}

                  handler.removeCallbacksAndMessages(null)
                  super.onDestroy()
              }
          }
