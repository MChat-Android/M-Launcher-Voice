                      val privacySections = listOf(
                          "1. Tentang M Asisten" to "M Asisten adalah aplikasi asisten suara untuk membantu menjalankan perintah dan membuka fitur atau aplikasi pada perangkat Android. Kebijakan ini berlaku untuk penggunaan aplikasi M Asisten. Dengan menggunakan fitur aplikasi, Anda memahami pemrosesan data sebagaimana dijelaskan di bawah. Fitur tertentu memerlukan izin perangkat dan koneksi internet.",
                          "2. Data yang diproses" to "Data yang dapat diproses meliputi: (a) data akun Google seperti ID pengguna Firebase, nama tampilan, dan alamat email; (b) data keanggotaan seperti status VIP, paket, masa berlaku, dan waktu pembaruan; (c) data permintaan pembayaran VIP seperti nama pengirim, paket, nominal, referensi transfer jika diisi, status permintaan, dan waktu pengajuan/verifikasi; (d) nama profil dan preferensi yang disimpan secara lokal; serta (e) informasi teknis yang dapat diproses oleh sistem Android, Firebase, Google Play Services, dan Google Mobile Ads sesuai fungsi masing-masing. M Asisten tidak meminta PIN, kata sandi bank, atau kode OTP.",
                          "3. Mikrofon dan pengenalan suara" to "Izin mikrofon digunakan untuk mengenali perintah suara. Pada mode Standar, pengenalan suara dimulai ketika Anda mengaktifkan widget atau fitur suara. Pada mode VIP, ketika layanan standby suara diaktifkan, aplikasi dapat terus menunggu kata pemicu “Hallo M” di latar belakang agar dapat menerima perintah berikutnya. Layanan ini menggunakan pengenalan suara pada perangkat Android melalui layanan pengenalan suara luring yang tersedia di perangkat. Aplikasi M Asisten tidak mengirim rekaman suara mentah ke server M Asisten atau menyimpan rekaman suara sebagai arsip. Ketersediaan pemrosesan sepenuhnya luring bergantung pada versi Android, layanan pengenalan suara, dan paket bahasa yang terpasang. Jika layanan pengenalan suara perangkat tidak sepenuhnya luring, pemrosesan oleh penyedia layanan tersebut mengikuti kebijakan penyedianya. Standby VIP memerlukan notifikasi layanan aktif, dapat meningkatkan penggunaan baterai, dan dapat dihentikan oleh sistem Android atau pengaturan baterai perangkat.",
                          "4. Aplikasi terpasang dan perintah membuka aplikasi" to "Untuk menampilkan daftar aplikasi dan menemukan aplikasi yang Anda sebutkan melalui perintah suara, M Asisten membaca nama aplikasi dan informasi komponen peluncur yang tersedia pada perangkat. Pencarian ini dilakukan di perangkat untuk menampilkan atau membuka aplikasi yang dipilih. Informasi daftar aplikasi tersebut tidak dikirim sebagai daftar ke Firebase oleh fitur launcher. Aplikasi tujuan dibuka melalui mekanisme Android; setelah dibuka, penggunaan dan pengumpulan data oleh aplikasi tujuan mengikuti kebijakan privasi masing-masing pengembang.",
                          "5. Izin perangkat" to "Izin mikrofon digunakan untuk perintah suara dan standby VIP. Izin kamera digunakan untuk mengendalikan lampu kilat sebagai senter, bukan untuk mengambil foto atau video melalui fitur senter. Izin tampil di atas aplikasi lain digunakan untuk menampilkan widget mengambang. Layanan latar depan dan notifikasi digunakan untuk menjaga layanan suara tetap terlihat ketika aktif. Izin Wake Lock membantu perangkat tetap aktif selama standby suara berjalan dan dapat menambah konsumsi baterai. Izin internet dan status jaringan digunakan untuk login, pemeriksaan keanggotaan, pengiriman permintaan VIP, serta layanan Google yang diperlukan. Izin perubahan pengaturan sistem hanya digunakan ketika Anda meminta fungsi yang memerlukan perubahan pengaturan, seperti kecerahan layar. Izin alarm digunakan untuk fungsi alarm jika tersedia dan diminta. Anda dapat mengelola atau mencabut izin melalui Pengaturan Android; pencabutan izin dapat membuat fitur terkait tidak berfungsi.",
                          "6. Akun Google, Firebase, dan keanggotaan VIP" to "Jika Anda memilih masuk dengan Google, M Asisten menggunakan Google Sign-In dan Firebase Authentication untuk mengautentikasi akun. Aplikasi dapat menyimpan ID pengguna, nama tampilan, alamat email, penyedia login, serta waktu login/pembaruan pada layanan Firebase. Data keanggotaan seperti status aktif, paket, masa berlaku, dan informasi pemeriksaan admin diproses melalui Cloud Firestore agar status VIP dapat ditampilkan dan diverifikasi. Sebagian status keanggotaan dapat disimpan sementara di perangkat untuk mendukung pemeriksaan akses saat koneksi tidak tersedia. Cache lokal terikat pada akun dan dibatasi oleh masa berlaku atau batas verifikasi yang diterapkan aplikasi.",
                          "7. Pembayaran VIP dan pembagian data" to "Pembayaran VIP pada versi ini dilakukan melalui transfer manual SeaBank dan diperiksa oleh admin. Saat Anda mengirim konfirmasi, aplikasi mengirim ID akun, nama dan email akun yang tersedia, paket yang dipilih, nominal, metode pembayaran, nama pengirim, referensi transfer jika diisi, serta status dan waktu permintaan ke Cloud Firestore. Admin yang berwenang dapat melihat data yang diperlukan untuk mencocokkan mutasi dan memutuskan verifikasi atau penolakan. Aplikasi tidak memproses nomor kartu, PIN, kata sandi bank, atau OTP dan saat ini tidak menyediakan unggahan bukti transfer. Jangan mengirim data rahasia perbankan melalui kolom konfirmasi.",
                          "8. Iklan dan layanan pihak ketiga" to "Kode aplikasi menyertakan Google Mobile Ads SDK. Versi saat ini menggunakan ID aplikasi dan unit iklan pengujian milik Google untuk pengembangan/pengujian, bukan ID iklan produksi milik M Asisten. SDK atau layanan Google dapat memproses informasi perangkat, diagnostik, interaksi iklan, atau pengenal yang diizinkan sistem untuk menyediakan dan mengukur layanan sesuai konfigurasi serta kebijakan Google. Google Sign-In, Firebase Authentication, dan Cloud Firestore juga memproses data yang diperlukan untuk fungsi akun dan keanggotaan. Data dapat diproses oleh penyedia layanan tersebut sesuai ketentuan privasi mereka. M Asisten tidak menjual data pribadi pengguna.",
                          "9. Penyimpanan, keamanan, dan masa retensi" to "Pengaturan tertentu dan cache keanggotaan disimpan secara lokal pada perangkat. Data akun, keanggotaan, dan permintaan pembayaran yang diperlukan untuk layanan disimpan pada layanan Firebase yang digunakan aplikasi. Data dikirim melalui koneksi layanan yang disediakan Google/Firebase; akses ke data dibatasi oleh autentikasi dan aturan keamanan layanan. Tidak ada sistem elektronik yang dapat dijamin 100% bebas risiko, sehingga pengguna tetap perlu menjaga keamanan perangkat dan akun Google. Data disimpan selama diperlukan untuk menyediakan layanan, memeriksa transaksi, menjaga keamanan, dan memenuhi kewajiban yang berlaku. Jangka retensi khusus untuk arsip transaksi dan penghapusan data akan ditetapkan dan diumumkan sebelum layanan dirilis secara publik.",
                          "10. Hak pengguna dan penghapusan data" to "Anda dapat berhenti menggunakan fitur suara, menonaktifkan widget, keluar dari akun Google melalui aplikasi, atau mencabut izin perangkat melalui Pengaturan Android. Keluar dari akun tidak sama dengan menghapus data akun di server. Mekanisme permintaan penghapusan akun dan data secara menyeluruh, termasuk jalur dari luar aplikasi, belum tersedia pada versi pengembangan ini dan harus diselesaikan sebelum rilis publik apabila pembuatan akun tetap disediakan. Permintaan penghapusan nantinya akan mencakup data akun dan data terkait pada layanan Firebase, dengan pengecualian terbatas jika penyimpanan diwajibkan untuk keamanan, pencegahan penyalahgunaan, atau kewajiban hukum. Jangan menganggap data server telah terhapus hanya dengan menghapus aplikasi dari perangkat.",
                          "11. Anak-anak dan penggunaan yang aman" to "M Asisten bukan aplikasi yang dirancang khusus untuk mengumpulkan data anak. Jika anak menggunakan perangkat, orang tua atau wali perlu mendampingi penggunaan, terutama saat memberikan izin mikrofon, kamera, atau login akun. Jangan memasukkan informasi sensitif, kata sandi, PIN, OTP, atau informasi keuangan rahasia ke dalam perintah suara maupun kolom aplikasi.",
                          "12. Perubahan kebijakan" to "Kebijakan ini dapat diperbarui jika fitur, layanan pihak ketiga, atau ketentuan hukum berubah. Versi terbaru akan ditampilkan pada bagian Kebijakan & Privasi di dalam aplikasi beserta tanggal pembaruannya. Jika perubahan berdampak penting pada cara data diproses, pengguna akan diberi pemberitahuan melalui sarana yang tersedia.",
                          "13. Kontak pengelola" to "Nama aplikasi: M Asisten. Email kontak resmi untuk pertanyaan privasi, permintaan akses atau penghapusan data, dan komunikasi terkait layanan: m.suara.pintar@gmail.com."
                      )

                      // Terjemahan lengkap isi kebijakan untuk perangkat berbahasa Inggris.
                      val englishPrivacySections = listOf(
                          "1. About M Asisten" to "M Asisten is a voice assistant application that helps users execute commands and open features or apps on Android devices. This policy applies to the use of the M Asisten application. By using the app features, you acknowledge the data processing described below. Certain features require device permissions and an internet connection.",
                          "2. Data We Process" to "The data that may be processed includes: (a) Google account data such as Firebase user ID, display name, and email address; (b) membership data such as VIP status, plan, expiration date, and update time; (c) VIP payment request data such as sender name, selected plan, amount, transfer reference if provided, request status, and submission or verification time; (d) profile names and preferences stored locally; and (e) technical information that may be processed by Android, Firebase, Google Play Services, and Google Mobile Ads according to their respective functions. M Asisten does not ask for your bank PIN, password, or one-time password (OTP).",
                          "3. Microphone and Voice Recognition" to "Microphone permission is used to recognize voice commands. In Standard mode, voice recognition starts when you activate the floating widget or voice feature. In VIP mode, when voice standby is enabled, the app may continuously wait for the wake phrase “Hallo M” in the background so it can receive the next command. This feature uses Android device voice recognition through the offline speech recognition service available on the device. M Asisten does not send raw voice recordings to M Asisten servers or store voice recordings as an archive. Fully offline processing depends on the Android version, speech recognition service, and language packs installed on the device. If the device speech recognition service is not fully offline, processing by that service provider is governed by its own policy. VIP standby requires an active service notification, may increase battery usage, and may be stopped by Android or the device battery settings.",
                          "4. Installed Apps and App Launch Commands" to "To display the app list and find an app mentioned in a voice command, M Asisten reads app names and launcher component information available on the device. This search takes place on the device to display or open the selected app. The launcher feature does not send the app list to Firebase. Target apps are opened through Android mechanisms; after an app is opened, its use and data collection are governed by that app developer’s own privacy policy.",
                          "5. Device Permissions" to "Microphone permission is used for voice commands and VIP standby. Camera permission is used to control the flash as a flashlight, not to take photos or videos through the flashlight feature. Display-over-other-apps permission is used to show the floating widget. Foreground service and notification permissions are used to keep the voice service visible while active. Wake Lock permission helps keep the device awake while voice standby is running and may increase battery consumption. Internet and network-state permissions are used for sign-in, membership checks, VIP requests, and required Google services. Permission to modify system settings is used only when you request a function that requires a settings change, such as screen brightness. Alarm permission is used for alarm functions when available and requested. You can manage or revoke permissions in Android Settings; revoking a permission may cause the related feature to stop working.",
                          "6. Google Account, Firebase, and VIP Membership" to "If you choose to sign in with Google, M Asisten uses Google Sign-In and Firebase Authentication to authenticate your account. The app may store your user ID, display name, email address, sign-in provider, and sign-in or update time through Firebase services. Membership data such as active status, plan, expiration date, and administrator verification information is processed through Cloud Firestore so VIP status can be displayed and verified. Some membership status information may be temporarily stored on the device to support access checks when a connection is unavailable. The local cache is tied to your account and limited by the expiration date or verification limits enforced by the app.",
                          "7. VIP Payments and Data Sharing" to "In this version, VIP payments are made by manual SeaBank bank transfer and reviewed by an administrator. When you submit a payment confirmation, the app sends your account ID, available account name and email, selected plan, amount, payment method, sender name, transfer reference if provided, and request status and time to Cloud Firestore. Authorized administrators can view the information needed to match the transfer with bank transaction records and decide whether to approve or reject the request. The app does not process card numbers, bank PINs, bank passwords, or OTPs, and it currently does not provide an in-app payment receipt upload feature. Do not submit confidential banking information in the confirmation fields.",
                          "8. Advertising and Third-Party Services" to "The application code includes the Google Mobile Ads SDK. The current version uses Google test app and ad unit IDs for development and testing, not M Asisten production advertising IDs. The SDK or Google services may process device information, diagnostics, ad interactions, or identifiers permitted by the system to provide and measure services in accordance with their configuration and Google policies. Google Sign-In, Firebase Authentication, and Cloud Firestore also process data required for account and membership features. Data may be processed by these service providers under their respective privacy terms. M Asisten does not sell users’ personal data.",
                          "9. Storage, Security, and Retention" to "Certain settings and membership cache data are stored locally on your device. Account, membership, and payment request data required to provide the service are stored in the Firebase services used by the app. Data is transmitted through connections provided by Google and Firebase; access is restricted through authentication and service security rules. No electronic system can be guaranteed to be 100% risk-free, so users should protect their devices and Google accounts. Data is retained for as long as necessary to provide the service, review transactions, maintain security, and meet applicable obligations. Specific retention periods for transaction records and data deletion procedures will be established and announced before public release.",
                          "10. User Rights and Data Deletion" to "You can stop using voice features, disable the floating widget, sign out of your Google account through the app, or revoke device permissions in Android Settings. Signing out is not the same as deleting account data from the server. A complete account and data deletion request process, including a method available outside the app, is not yet available in this development version and must be completed before public release if account creation remains available. Future deletion requests will cover account data and related data in Firebase services, subject to limited exceptions where retention is required for security, abuse prevention, or legal obligations. Do not assume server data has been deleted simply by uninstalling the app.",
                          "11. Children and Safe Use" to "M Asisten is not an app specifically designed to collect children’s data. If a child uses the device, a parent or guardian should supervise use, especially when granting microphone or camera permissions or signing in to an account. Do not enter sensitive information, passwords, PINs, OTPs, or confidential financial information into voice commands or app fields.",
                          "12. Policy Changes" to "This policy may be updated if app features, third-party services, or legal requirements change. The latest version will be displayed in the Policy & Privacy section of the app together with its update date. If a change materially affects how data is processed, users will be notified through available communication channels.",
