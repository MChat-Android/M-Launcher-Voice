              private fun loadStandardRewardedAd() {
                  if (isAdLoading || rewardedAd != null || isFinishing) return
                  isAdLoading = true
                  RewardedAd.load(
                      this,
                      REWARDED_AD_UNIT_ID,
                      AdRequest.Builder().build(),
                      object : RewardedAdLoadCallback() {
                          override fun onAdLoaded(ad: RewardedAd) {
                              isAdLoading = false
                              rewardedAd = ad
                              if (standardActivationPending) showLoadedStandardRewardedAd()
                          }

                          override fun onAdFailedToLoad(error: LoadAdError) {
                              isAdLoading = false
                              rewardedAd = null
                              if (standardActivationPending) {
                                  failStandardActivation("Iklan belum tersedia. Widget belum diaktifkan. Coba lagi beberapa saat.")
                              }
                          }
                      }
                  )
              }

              private fun showStandardAdThen(activateWidget: () -> Unit) {
                  if (standardActivationPending) return
                  standardActivationPending = true
                  standardRewardEarned = false
                  standardWidgetStarter = activateWidget
                  message = "Menyiapkan iklan Rewarded sebelum widget diaktifkan..."
                  if (rewardedAd != null) {
                      showLoadedStandardRewardedAd()
                  } else if (!isAdLoading) {
                      loadStandardRewardedAd()
                  }
              }

              private fun showLoadedStandardRewardedAd() {
                  val ad = rewardedAd
                  if (ad == null) {
                      if (!isAdLoading) loadStandardRewardedAd()
                      return
                  }
                  rewardedAd = null
                  standardRewardEarned = false
                  ad.fullScreenContentCallback = object : FullScreenContentCallback() {
                      override fun onAdDismissedFullScreenContent() {
                          if (standardRewardEarned) {
                              completeStandardActivation()
                          } else {
                              failStandardActivation("Iklan belum selesai. Widget tidak diaktifkan.")
                          }
                          loadStandardRewardedAd()
                      }

                      override fun onAdFailedToShowFullScreenContent(error: AdError) {
                          failStandardActivation("Iklan gagal ditampilkan. Widget tidak diaktifkan.")
                          loadStandardRewardedAd()
                      }
                  }
                  try {
                      ad.show(this) {
                          // Reward callback wajib diterima sebelum widget boleh aktif.
                          standardRewardEarned = true
                          message = "Reward diterima. Menyelesaikan aktivasi widget..."
                      }
                  } catch (_: Exception) {
                      failStandardActivation("Iklan tidak dapat ditampilkan. Widget tidak diaktifkan.")
                      loadStandardRewardedAd()
                  }
              }

              private fun completeStandardActivation() {
                  if (!standardActivationPending || !standardRewardEarned) return
                  standardActivationPending = false
                  standardRewardEarned = false
                  val startWidget = standardWidgetStarter
                  standardWidgetStarter = null
                  startWidget?.invoke()
              }

              private fun failStandardActivation(reason: String) {
                  if (!standardActivationPending) return
                  standardActivationPending = false
                  standardRewardEarned = false
                  standardWidgetStarter = null
                  message = reason
              }

              private fun startWidgetService(mode: String) {
                  try {
                      val intent = Intent(this, FloatingVoiceService::class.java)
                          .putExtra(FloatingVoiceService.EXTRA_MODE, mode)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(intent)
                      } else {
                          startService(intent)
                      }
                      message = if (mode == FloatingVoiceService.MODE_VIP) {
                          "Widget VIP aktif. M Asisten siap menunggu panggilan Hallo M."
                      } else {
                          "Widget Standar aktif. Ketuk lalu ucapkan perintah untuk aplikasi bawaan."
                      }
                  } catch (e: Exception) {
                      message = "Tidak dapat mengaktifkan widget: ${e.message}"
                  }
              }

              private fun signOutAccount() {
                  // Akhiri sesi widget sebelum mengunci kembali akses ke halaman beranda.
                  stopService(Intent(this, FloatingVoiceService::class.java))
                  isAuthenticated = false
                  isGoogleSignInLoading = false
                  // Keluar dari Firebase dan sesi Google agar pengguna bisa memilih akun kedua.
                  FirebaseAuth.getInstance().signOut()
                  val webClientId = resources.getIdentifier("default_web_client_id", "string", packageName)
                  val optionsBuilder = GoogleSignInOptions.Builder(GoogleSignInOptions.DEFAULT_SIGN_IN).requestEmail()
                  if (webClientId != 0) optionsBuilder.requestIdToken(getString(webClientId))
                  GoogleSignIn.getClient(this, optionsBuilder.build()).signOut()
                  googleAccountName = ""
                  googleAccountEmail = ""
                  vipMembershipStatus = "BELUM AKTIF"
                  isAdminAccount = false
                  message = "Akun berhasil keluar. Silakan masuk dengan akun lain."
              }

              private fun beginSetup() {
                  // Kedua paket memakai mikrofon setelah widget diketuk.
                  val permissions = mutableListOf(Manifest.permission.RECORD_AUDIO)

                  if (Build.VERSION.SDK_INT >= 33) {
                      permissions.add(Manifest.permission.POST_NOTIFICATIONS)
                  }

                  val missing = permissions.filter {
                      checkSelfPermission(it) != PackageManager.PERMISSION_GRANTED
                  }

                  if (missing.isNotEmpty()) {
                      permissionLauncher.launch(missing.toTypedArray())
                  } else {
                      continueSetup()
                  }
              }

              private fun continueSetup() {
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      message = "Izinkan akses mikrofon untuk mengaktifkan widget."
                      return
                  }
                  if (!Settings.canDrawOverlays(this)) {
                      message = "Izinkan M Asisten tampil di atas aplikasi lain"
                      val intent = Intent(
                          Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                          Uri.parse("package:$packageName")
                      )
                      overlayLauncher.launch(intent)
                  } else {
                      startFloatingService()
                  }
              }

              private fun startFloatingService() {
                  val user = FirebaseAuth.getInstance().currentUser
                  if (user == null) {
                      showStandardAdThen {
                          startWidgetService(FloatingVoiceService.MODE_STANDARD)
                      }
                      return
                  }
                  val userUid = user.uid

                  fun launchWidget(mode: String) {
                      if (mode == FloatingVoiceService.MODE_STANDARD) {
                          showStandardAdThen { startWidgetService(mode) }
                      } else {
                          startWidgetService(mode)
                      }
                  }

                  fun activateVerifiedVip(
                      isVip: Boolean,
                      expiresAt: Long = 0L,
                      admin: Boolean = false,
                      fromOfflineCache: Boolean = false
                  ) {
                      if (isVip && !fromOfflineCache) {
                          VipEntitlementCache.save(this, userUid, true, expiresAt, admin)
                      } else if (!isVip) {
                          VipEntitlementCache.clear(this, userUid)
                      }
                      if (isVip &&
                          checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED
                      ) {
                          message = "VIP aktif. Izinkan mikrofon untuk memakai asisten suara."
                          permissionLauncher.launch(arrayOf(Manifest.permission.RECORD_AUDIO))
                          return
                      }
                      launchWidget(if (isVip) FloatingVoiceService.MODE_VIP else FloatingVoiceService.MODE_STANDARD)
                  }

                  fun useOfflineEntitlement() {
                      val cached = VipEntitlementCache.isActive(this, userUid)
                      activateVerifiedVip(
                          cached,
                          VipEntitlementCache.expiry(this, userUid),
                          VipEntitlementCache.isAdmin(this, userUid),
                          fromOfflineCache = true
                      )
                  }

                  user.getIdToken(true)
                      .addOnSuccessListener { token ->
                          val admin = token.claims["admin"] == true
                          isAdminAccount = admin
                          if (admin) {
                              vipMembershipStatus = "VIP AKTIF • ADMIN"
                              activateVerifiedVip(true, 0L, true)
                          } else {
                              FirebaseFirestore.getInstance()
                                  .collection("vip_members")
                                  .document(userUid)
                                  .get(com.google.firebase.firestore.Source.SERVER)
                                  .addOnSuccessListener { member ->
                                      val expiresAt = member.getTimestamp("expiresAt")?.toDate()?.time ?: 0L
                                      val active = member.getString("membershipStatus") == "ACTIVE" &&
                                          ((expiresAt == 0L && member.getString("membershipPlan") == "VIP Permanen") || expiresAt > System.currentTimeMillis())
                                      if (active) {
                                          vipMembershipStatus = "VIP AKTIF"
                                          activateVerifiedVip(true, expiresAt, false)
                                      } else {
                                          VipEntitlementCache.clear(this, userUid)
                                          // Periksa Trial yang sudah ada tanpa memulai waktu baru.
                                          // Untuk Trial pertama, catatan Firebase baru dibuat setelah iklan selesai
                                          // dan tepat sebelum widget VIP benar-benar dijalankan.
                                          resolveTrialEntitlement(userUid, false) { existingTrialActive, _ ->
                                              showStandardAdThen {
                                                  if (existingTrialActive) {
                                                      vipMembershipStatus = "TRIAL AKTIF"
                                                      startWidgetService(FloatingVoiceService.MODE_VIP)
                                                  } else {
                                                      resolveTrialEntitlement(userUid, true) { trialStarted, _ ->
                                                          if (trialStarted) {
                                                              vipMembershipStatus = "TRIAL AKTIF"
                                                              startWidgetService(FloatingVoiceService.MODE_VIP)
                                                          } else {
                                                              vipMembershipStatus = "PAKET STANDAR"
                                                              startWidgetService(FloatingVoiceService.MODE_STANDARD)
                                                          }
                                                      }
                                                  }
                                              }
                                          }
                                      }
                                  }
                                  .addOnFailureListener { useOfflineEntitlement() }
                          }
                      }
                      .addOnFailureListener { useOfflineEntitlement() }
              }
          }

