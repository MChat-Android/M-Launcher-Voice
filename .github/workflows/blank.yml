          @Composable
          private fun MLauncherHome(
              message: String,
              onActivate: () -> Unit,
              googleAccountName: String,
              googleAccountEmail: String,
              vipMembershipStatus: String,
              isAdminAccount: Boolean,
              onGoogleSignIn: () -> Unit,
              onLogout: () -> Unit
          ) {
              val isEnglish = Locale.getDefault().language.equals("en", ignoreCase = true)
              var showVipPlus by remember { mutableStateOf(false) }
              var selectedVipPlan by remember { mutableStateOf("VIP Bulanan (30 hari)") }
              var payerName by remember { mutableStateOf("") }
              var transferReference by remember { mutableStateOf("") }
              var paymentSubmitting by remember { mutableStateOf(false) }
              var paymentSubmitMessage by remember { mutableStateOf("") }
              var paymentHistory by remember { mutableStateOf(listOf<String>()) }
              var historyLoading by remember { mutableStateOf(false) }
              var adminItems by remember { mutableStateOf(listOf<Pair<String, String>>()) }
              var adminBusy by remember { mutableStateOf(false) }
              var adminMessage by remember { mutableStateOf("") }
              var showAdminPanel by remember { mutableStateOf(false) }
              var adminDashboardLoading by remember { mutableStateOf(false) }
              var adminUnreadCount by remember { mutableStateOf(0) }
              var adminActiveCount by remember { mutableStateOf(0) }
              var adminTotalCount by remember { mutableStateOf(0) }
              var adminPendingCount by remember { mutableStateOf(0) }
              var adminVipRows by remember { mutableStateOf(listOf<String>()) }
              var adminPaymentRows by remember { mutableStateOf(listOf<String>()) }
              var adminAuditEvents by remember { mutableStateOf(listOf<String>()) }
              var simulationMessage by remember { mutableStateOf("") }
              var expandedPrivacySection by remember { mutableStateOf<String?>(null) }
              val Navy = Color(0xFF07111F)
              val Panel = Color(0xFF111F32)
              val Cyan = Color(0xFF35D6E8)
              val Muted = Color(0xFF9DB2C9)
              val isVipPlus = vipMembershipStatus.startsWith("VIP AKTIF") ||
                  vipMembershipStatus.startsWith("TRIAL AKTIF")
              val notificationContext = LocalContext.current

              // Pantau perubahan status VIP dan pembayaran akun ini selama beranda terbuka.
              DisposableEffect(googleAccountEmail) {
                  val currentUser = FirebaseAuth.getInstance().currentUser
                  if (currentUser == null) {
                      onDispose { }
                  } else {
                      val uid = currentUser.uid
                      var firstMemberSnapshot = true
                      var firstPaymentSnapshot = true
                      val db = FirebaseFirestore.getInstance()
                      val memberListener = db.collection("vip_members").document(uid)
                          .addSnapshotListener { snapshot, error ->
                              if (error == null && snapshot != null && !snapshot.metadata.isFromCache) {
                                  val expiresAt = snapshot.getTimestamp("expiresAt")?.toDate()?.time ?: 0L
                                  val active = snapshot.getString("membershipStatus") == "ACTIVE" &&
                                      ((expiresAt == 0L && snapshot.getString("membershipPlan") == "VIP Permanen") || expiresAt > System.currentTimeMillis())
                                  if (active) {
                                      VipEntitlementCache.save(notificationContext, uid, true, expiresAt, false)
                                  } else {
                                      VipEntitlementCache.clear(notificationContext, uid)
                                  }
                                  firstMemberSnapshot = false
                              }
                          }
                      val paymentListener = db.collection("vip_payment_requests")
                          .whereEqualTo("uid", uid)
                          .limit(30)
                          .addSnapshotListener { snapshot, error ->
                              if (error == null && snapshot != null) {
                                  if (firstPaymentSnapshot) {
                                      firstPaymentSnapshot = false
                                  } else {
                                      snapshot.documentChanges.forEach { change ->
                                          if (change.type == com.google.firebase.firestore.DocumentChange.Type.MODIFIED) {
                                              val status = change.document.getString("status").orEmpty()
                                              val plan = change.document.getString("plan").orEmpty().replace("VIP", "VIP")
                                              when (status) {
                                                  "VERIFIED" -> MAsistenNotifications.post(
                                                      notificationContext, 4401,
                                                      "Pembayaran terverifikasi",
                                                      "Pembayaran $plan telah diverifikasi. Periksa status paket VIP Anda."
                                                  )
                                                  "REJECTED" -> MAsistenNotifications.post(
                                                      notificationContext, 4402,
                                                      "Konfirmasi pembayaran ditolak",
                                                      "Konfirmasi $plan ditolak. Buka riwayat transaksi untuk melihat status terbaru."
                                                  )
                                              }
                                          }
                                      }
                                  }
                              }
                          }
                      onDispose {
                          memberListener.remove()
                          paymentListener.remove()
                      }
                  }
              }

              // Pantau perubahan administrasi hanya selama sesi admin aktif.
              // Snapshot pertama menjadi baseline dan tidak memunculkan notifikasi palsu.
              DisposableEffect(isAdminAccount) {
                  if (!isAdminAccount) {
                      onDispose { }
                  } else {
                      val db = FirebaseFirestore.getInstance()
                      var firstMemberSnapshot = true
                      var firstPaymentSnapshot = true
                      val memberRegistration = db.collection("vip_members")
                          .limit(100)
                          .addSnapshotListener { snapshot, error ->
                              if (error == null && snapshot != null) {
                                  if (firstMemberSnapshot) {
                                      firstMemberSnapshot = false
                                  } else if (snapshot.documentChanges.isNotEmpty()) {
                                      val events = snapshot.documentChanges.map { change ->
                                          val email = change.document.getString("email").orEmpty()
                                          val label = if (email.isBlank()) change.document.id else email
                                          "Data keanggotaan berubah • $label • ${change.type.name}"
                                      }
                                      adminAuditEvents = (events + adminAuditEvents).take(30)
                                      adminUnreadCount += events.size
                                  }
                              }
                          }
                      val paymentRegistration = db.collection("vip_payment_requests")
                          .orderBy("createdAt", com.google.firebase.firestore.Query.Direction.DESCENDING)
                          .limit(50)
                          .addSnapshotListener { snapshot, error ->
                              if (error == null && snapshot != null) {
                                  if (firstPaymentSnapshot) {
                                      firstPaymentSnapshot = false
                                  } else if (snapshot.documentChanges.isNotEmpty()) {
                                      val events = snapshot.documentChanges.map { change ->
                                          val email = change.document.getString("email").orEmpty()
                                          val status = change.document.getString("status").orEmpty()
                                          "Administrasi pembayaran berubah • ${email.ifBlank { change.document.id }} • $status"
                                      }
                                      adminAuditEvents = (events + adminAuditEvents).take(30)
                                      adminUnreadCount += events.size
                                  }
                              }
                          }
                      onDispose {
                          memberRegistration.remove()
                          paymentRegistration.remove()
                      }
                  }
              }

              val refreshAdminDashboard: () -> Unit = {
                  adminDashboardLoading = true
                  val db = FirebaseFirestore.getInstance()
                  db.collection("vip_members").limit(100).get()
                      .addOnSuccessListener { snapshot ->
                          val formatter = java.text.SimpleDateFormat("dd MMM yyyy, HH:mm", java.util.Locale("id", "ID"))
                          adminVipRows = snapshot.documents.map { document ->
                              val email = document.getString("email").orEmpty().ifBlank { document.id }
                              val status = document.getString("membershipStatus") ?: "FREE"
                              val plan = document.getString("membershipPlan") ?: "Standard"
                              val expiry = document.getTimestamp("expiresAt")?.toDate()?.let { formatter.format(it) } ?: "Tidak ada batas"
                              "$email • $status • $plan • Berakhir: $expiry"
                          }
                          db.collection("vip_members").count()
                              .get(com.google.firebase.firestore.AggregateSource.SERVER)
                              .addOnSuccessListener { adminTotalCount = it.count.toInt() }
                          db.collection("vip_members").whereEqualTo("membershipStatus", "ACTIVE").count()
                              .get(com.google.firebase.firestore.AggregateSource.SERVER)
                              .addOnSuccessListener { adminActiveCount = it.count.toInt() }
                          db.collection("vip_payment_requests")
                              .whereEqualTo("status", "PENDING_REVIEW").count()
                              .get(com.google.firebase.firestore.AggregateSource.SERVER)
                              .addOnSuccessListener { adminPendingCount = it.count.toInt() }
                          db.collection("vip_payment_requests")
                              .orderBy("createdAt", com.google.firebase.firestore.Query.Direction.DESCENDING)
                              .limit(100).get()
                              .addOnSuccessListener { payments ->
                                  adminPaymentRows = payments.documents.map { document ->
                                      val email = document.getString("email").orEmpty()
                                      val plan = document.getString("plan").orEmpty()
                                      val amount = document.getLong("amountIdr") ?: 0L
                                      val status = document.getString("status") ?: "?"
                                      val date = document.getTimestamp("createdAt")?.toDate()?.let { formatter.format(it) } ?: "Waktu tidak tersedia"
                                      "${email.ifBlank { document.id }} • $plan • Rp$amount • $status • $date"
                                  }
                                  adminDashboardLoading = false
                              }
                              .addOnFailureListener { error ->
                                  adminDashboardLoading = false
                                  adminMessage = "Gagal memuat riwayat pembayaran: ${error.localizedMessage}"
                              }
                      }
                      .addOnFailureListener { error ->
                          adminDashboardLoading = false
                          adminMessage = "Gagal memuat data keanggotaan: ${error.localizedMessage}"
                      }
              }
              // Fondasi visual VIP: hitam obsidian, emas hangat, dan panel berlapis.
              // Warna premium hanya diterapkan ketika keanggotaan VIP terverifikasi.
              val premiumGold = Color(0xFFFFD36A)
              val premiumBorder = Color(0xFFC69A45)
              val premiumPanel = Color(0xFF17130D)
              val premiumPanelRaised = Color(0xFF211A10)
              val premiumText = Color(0xFFFFF2D2)
              val premiumMuted = Color(0xFFC7B58E)
              // Bayangan tipografi memberi kedalaman 3D tanpa mengubah warna judul.
              val vipTitleStyle = androidx.compose.ui.text.TextStyle(
                  shadow = androidx.compose.ui.graphics.Shadow(
                      color = Color(0xFF000000),
                      blurRadius = 5f,
                      offset = androidx.compose.ui.geometry.Offset(2f, 3f)
                  )
              )
              BoxWithConstraints(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(
                          if (isVipPlus) {
                              Brush.verticalGradient(
                                   listOf(
                                       Color(0xFF050403),
                                       Color(0xFF100D08),
                                       Color(0xFF1B150B),
                                       Color(0xFF080705)
                                   )
                               )
                          } else {
                              Brush.verticalGradient(listOf(Navy, Panel, Navy))
                          }
                      ),
                  contentAlignment = Alignment.TopCenter
              ) {
                  val compactWidth = maxWidth < 360.dp
                  val pageHorizontalPadding = if (compactWidth) 14.dp else 22.dp
                  val pageVerticalPadding = if (maxHeight < 650.dp) 16.dp else 28.dp
                  val heroImageSize = (maxWidth * 0.46f).coerceIn(128.dp, 176.dp)
                  val contentWidth = maxWidth.coerceAtMost(600.dp)

                  Column(
                      modifier = Modifier
                          .width(contentWidth)
                          .fillMaxHeight()
                          .verticalScroll(rememberScrollState())
                          .padding(horizontal = pageHorizontalPadding, vertical = pageVerticalPadding),
                      horizontalAlignment = Alignment.CenterHorizontally
                  ) {
                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .padding(top = 30.dp),
                          horizontalArrangement = Arrangement.End,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          if (isAdminAccount) {
                              Box(contentAlignment = Alignment.TopEnd) {
                                  OutlinedButton(
                                      onClick = {
                                          showAdminPanel = true
                                          adminUnreadCount = 0
                                          refreshAdminDashboard()
                                      },
                                      contentPadding = PaddingValues(horizontal = 14.dp, vertical = 5.dp),
                                      border = androidx.compose.foundation.BorderStroke(1.dp, Cyan),
                                      colors = ButtonDefaults.outlinedButtonColors(contentColor = Cyan)
                                  ) {
                                      Text("ADMIN", fontSize = 10.sp, fontWeight = FontWeight.ExtraBold)
                                  }
                                  if (adminUnreadCount > 0) {
                                      Box(
                                          modifier = Modifier
                                              .offset(x = 4.dp, y = (-4).dp)
                                              .size(18.dp)
                                              .clip(CircleShape)
                                              .background(Color(0xFFE53935)),
                                          contentAlignment = Alignment.Center
                                      ) {
                                          Text(if (adminUnreadCount > 99) "99+" else adminUnreadCount.toString(), color = Color.White, fontSize = 8.sp, fontWeight = FontWeight.Black)
                                      }
                                  }
                              }
                          }
                      }
                      Spacer(Modifier.height(8.dp))

                      Box(
                          modifier = Modifier.size(heroImageSize),
                          contentAlignment = Alignment.Center
                      ) {
                          Image(
                              painter = painterResource(id = R.drawable.launcher_home),
                              contentDescription = "Ikon resmi M Asisten",
                              modifier = Modifier.fillMaxSize().clip(CircleShape),
                              contentScale = ContentScale.Fit
                          )

                          // Tulisan VIP transparan dengan efek emas berlapis di bagian bawah logo.
                          // Tidak memakai bidang/latar agar gambar utama tetap terlihat utuh.
                          if (isVipPlus) {
                              Box(
                                  modifier = Modifier
                                      .align(Alignment.BottomCenter)
                                      .offset(y = 12.dp),
                                  contentAlignment = Alignment.Center
                              ) {
                                  Text(
                                      text = "VIP",
                                      color = Color(0xFF6F470D),
                                      fontSize = if (compactWidth) 27.sp else 32.sp,
                                      fontWeight = FontWeight.Black,
                                      letterSpacing = 3.5.sp,
                                      style = androidx.compose.ui.text.TextStyle(
                                          shadow = androidx.compose.ui.graphics.Shadow(
                                              color = Color(0xFF000000),
                                              blurRadius = 9f,
                                              offset = androidx.compose.ui.geometry.Offset(3f, 5f)
                                          )
                                      )
                                  )
                                  Text(
                                      text = "VIP",
                                      color = Color(0xFFFFD36A),
                                      fontSize = if (compactWidth) 27.sp else 32.sp,
                                      fontWeight = FontWeight.Black,
                                      letterSpacing = 3.5.sp,
                                      style = androidx.compose.ui.text.TextStyle(
                                          shadow = androidx.compose.ui.graphics.Shadow(
                                              color = Color(0xFFFFE7A3),
                                              blurRadius = 2f,
                                              offset = androidx.compose.ui.geometry.Offset(-1f, -1f)
                                          )
                                      )
                                  )
                              }
                          }
                      }

                      Text(
                          "DIBUAT DI INDONESIA",
                          color = if (isVipPlus) premiumMuted else Muted,
                          fontSize = 9.sp,
                          fontWeight = FontWeight.Bold,
                          letterSpacing = 1.4.sp,
                          textAlign = TextAlign.Center
                      )
                      Spacer(Modifier.height(25.dp))
                      Text(
                          "Semua jadi lebih mudah.",
                          color = if (isVipPlus) premiumText else Color.White,
                          fontSize = if (compactWidth) 21.sp else 25.sp,
                          fontWeight = FontWeight.ExtraBold,
                          textAlign = TextAlign.Center,
                          style = if (isVipPlus) vipTitleStyle else androidx.compose.ui.text.TextStyle.Default
                      )
                      Spacer(Modifier.height(8.dp))
                      Text(
                          "Kendalikan ponselmu cukup dengan suara.",
                          color = if (isVipPlus) premiumMuted else Muted,
                          fontSize = 14.sp,
                          textAlign = TextAlign.Center
                      )

                      Spacer(Modifier.height(26.dp))
                      Card(
                          modifier = Modifier.fillMaxWidth(),
                          shape = RoundedCornerShape(24.dp),
