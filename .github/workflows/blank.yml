
name: Build M Asisten

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Enable AndroidX
        run: |
          printf "android.useAndroidX=true\\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\\norg.gradle.workers.max=2\\n" > gradle.properties

      - name: Create Android Project
        run: |
          mkdir -p app/src/main/java/com/m/launchervoice

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "M-Launcher-Voice"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.m.launchervoice"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.m.launchervoice"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 20
                  versionName = "2.18"
              }

              signingConfigs {
                  create("release") {
                      storeFile = file(System.getenv("SIGNING_STORE_FILE"))
                      storePassword = System.getenv("SIGNING_STORE_PASSWORD")
                      keyAlias = System.getenv("SIGNING_KEY_ALIAS")
                      keyPassword = System.getenv("SIGNING_KEY_PASSWORD")
                  }
              }

              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.activity:activity-compose:1.10.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>

              <uses-feature
                  android:name="android.hardware.camera.flash"
                  android:required="false"/>

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.LAUNCHER"/>
                  </intent>
              </queries>

              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="M Asisten"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:allowBackup="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.HOME"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".FloatingVoiceService"
                      android:exported="false"
                      android:foregroundServiceType="microphone"/>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/m/launchervoice/MainActivity.kt <<'EOF'
          package com.m.launchervoice

          import android.Manifest
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.Image
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.res.painterResource
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.asImageBitmap
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.compose.ui.window.DialogProperties

          private val Navy = Color(0xFF07111F)
          private val Panel = Color(0xFF111F32)
          private val Cyan = Color(0xFF35D6E8)
          private val Blue = Color(0xFF397BFF)
          private val Muted = Color(0xFF9DB2C9)

          class MainActivity : ComponentActivity() {

              private var message by mutableStateOf("Widget mikrofon siap diaktifkan")

              private val permissionLauncher =
                  registerForActivityResult(
                      ActivityResultContracts.RequestMultiplePermissions()
                  ) {
                      continueSetup()
                  }

              private val overlayLauncher =
                  registerForActivityResult(
                      ActivityResultContracts.StartActivityForResult()
                  ) {
                      if (Settings.canDrawOverlays(this)) {
                          startFloatingService()
                      } else {
                          message = "Izin tampil di atas aplikasi belum diberikan"
                      }
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  setContent {
                      MaterialTheme(
                          colorScheme = darkColorScheme(
                              primary = Cyan,
                              background = Navy,
                              surface = Panel,
                              onPrimary = Navy,
                              onBackground = Color.White,
                              onSurface = Color.White
                          )
                      ) {
                          MLauncherHome(
                              message = message,
                              onActivate = { beginSetup() }
                          )
                      }
                  }
              }

              private fun beginSetup() {
                  val permissions = mutableListOf(
                      Manifest.permission.RECORD_AUDIO,
                      Manifest.permission.CAMERA
                  )

                  if (Build.VERSION.SDK_INT >= 33) {
                      permissions.add(Manifest.permission.POST_NOTIFICATIONS)
                  }

                  val missing = permissions.filter {
                      checkSelfPermission(it) != PackageManager.PERMISSION_GRANTED
                  }

                  if (missing.isNotEmpty()) {
                      permissionLauncher.launch(missing.toTypedArray())
                  } else {
                      continueSetup()
                  }
              }

              private fun continueSetup() {
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                      != PackageManager.PERMISSION_GRANTED
                  ) {
                      message = "Izin mikrofon diperlukan"
                      return
                  }

                  if (!Settings.canDrawOverlays(this)) {
                      message = "Izinkan M Asisten tampil di atas aplikasi lain"
                      val intent = Intent(
                          Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                          Uri.parse("package:$packageName")
                      )
                      overlayLauncher.launch(intent)
                  } else {
                      startFloatingService()
                  }
              }

              private fun startFloatingService() {
                  try {
                      val intent = Intent(this, FloatingVoiceService::class.java)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(intent)
                      } else {
                          startService(intent)
                      }
                      message = "Widget mikrofon sudah diaktifkan"
                  } catch (e: Exception) {
                      message = "Tidak dapat mengaktifkan widget: ${e.message}"
                  }
              }
          }

          @Composable
          private fun MLauncherHome(
              message: String,
              onActivate: () -> Unit
          ) {
              var showVipPlus by remember { mutableStateOf(false) }
              var selectedVipPlan by remember { mutableStateOf("VIP+ Bulanan") }
              val context = LocalContext.current
              val accountPrefs = remember {
                  context.getSharedPreferences("m_asisten_account", android.content.Context.MODE_PRIVATE)
              }
              var memberName by remember {
                  mutableStateOf(accountPrefs.getString("display_name", "Pengguna M Asisten") ?: "Pengguna M Asisten")
              }
              val memberId = remember {
                  accountPrefs.getString("member_id", null) ?: (
                      "MA-" + java.util.UUID.randomUUID().toString()
                          .replace("-", "").take(10).uppercase()
                  ).also { generatedId ->
                      accountPrefs.edit().putString("member_id", generatedId).apply()
                  }
              }
              var showAccountEditor by remember { mutableStateOf(false) }
              var editedMemberName by remember { mutableStateOf(memberName) }
              val Navy = Color(0xFF07111F)
              val Panel = Color(0xFF111F32)
              val Cyan = Color(0xFF35D6E8)
              val Muted = Color(0xFF9DB2C9)
              Box(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(
                          Brush.verticalGradient(listOf(Navy, Panel, Navy))
                      )
              ) {
                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .verticalScroll(rememberScrollState())
                          .padding(horizontal = 22.dp, vertical = 28.dp),
                      horizontalAlignment = Alignment.CenterHorizontally
                  ) {
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Image(
                              painter = painterResource(id = R.mipmap.ic_launcher),
                              contentDescription = "Ikon M Asisten",
                              modifier = Modifier.size(52.dp).clip(RoundedCornerShape(14.dp)),
                              contentScale = ContentScale.Crop
                          )
                          Spacer(Modifier.width(13.dp))
                          Column {
                              Text("M ASISTEN", color = Color.White, fontSize = 18.sp, fontWeight = FontWeight.ExtraBold)
                              Text("SMART  •  VOICE  •  ASSISTANT", color = Cyan, fontSize = 9.sp, fontWeight = FontWeight.Bold, letterSpacing = 1.2.sp)
                              Text("MADE IN INDONESIA", color = Muted, fontSize = 8.sp, fontWeight = FontWeight.Bold, letterSpacing = 1.1.sp)
                          }
                          Spacer(Modifier.weight(1f))
                          Box(
                              modifier = Modifier
                                  .clip(CircleShape)
                                  .clickable { showVipPlus = true }
                                  .background(Color(0xFF123344))
                                  .padding(horizontal = 11.dp, vertical = 7.dp)
                          ) {
                              Text("VIP+", color = Cyan, fontSize = 10.sp, fontWeight = FontWeight.Bold)
                          }
                      }

                      Spacer(Modifier.height(34.dp))

                      Image(
                          painter = painterResource(id = R.drawable.launcher_home),
                          contentDescription = "Ikon resmi M Asisten",
                          modifier = Modifier.size(176.dp).clip(RoundedCornerShape(38.dp)),
                          contentScale = ContentScale.Fit
                      )

                      Spacer(Modifier.height(25.dp))
                      Text(
                          "Semua jadi lebih mudah.",
                          color = Color.White,
                          fontSize = 25.sp,
                          fontWeight = FontWeight.ExtraBold,
                          textAlign = TextAlign.Center
                      )
                      Spacer(Modifier.height(8.dp))
                      Text(
                          "Kendalikan ponselmu cukup dengan suara.",
                          color = Muted,
                          fontSize = 14.sp,
                          textAlign = TextAlign.Center
                      )

                      Spacer(Modifier.height(26.dp))
                      Card(
                          modifier = Modifier.fillMaxWidth(),
                          shape = RoundedCornerShape(24.dp),
                          colors = CardDefaults.cardColors(containerColor = Panel)
                      ) {
                          Column(
                              modifier = Modifier.padding(20.dp),
                              horizontalAlignment = Alignment.CenterHorizontally
                          ) {
                              Text("MULAI GUNAKAN ASISTEN", color = Muted, fontSize = 10.sp, fontWeight = FontWeight.Bold, letterSpacing = 1.3.sp)
                              Spacer(Modifier.height(14.dp))
                              Button(
                                  onClick = onActivate,
                                  modifier = Modifier.fillMaxWidth().height(56.dp),
                                  shape = RoundedCornerShape(17.dp),
                                  colors = ButtonDefaults.buttonColors(containerColor = Cyan, contentColor = Navy)
                              ) {
                                  Text("🎙   AKTIFKAN WIDGET", fontSize = 15.sp, fontWeight = FontWeight.ExtraBold)
                              }
                              Spacer(Modifier.height(12.dp))
                              Text(message, color = if (message.contains("diaktifkan")) Cyan else Muted, fontSize = 12.sp, textAlign = TextAlign.Center)
                          }
                      }

                      Spacer(Modifier.height(22.dp))
                      Card(
                          modifier = Modifier.fillMaxWidth(),
                          shape = RoundedCornerShape(20.dp),
                          colors = CardDefaults.cardColors(containerColor = Color(0xFF102238))
                      ) {
                          Column(modifier = Modifier.padding(17.dp)) {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Column(modifier = Modifier.weight(1f)) {
                                      Text("AKUN M ASISTEN", color = Cyan, fontSize = 11.sp, fontWeight = FontWeight.Bold, letterSpacing = 1.sp)
                                      Spacer(Modifier.height(5.dp))
                                      Text(memberName, color = Color.White, fontSize = 17.sp, fontWeight = FontWeight.Bold)
                                      Text("ID Anggota: $memberId", color = Muted, fontSize = 11.sp)
                                  }
                                  Text("M", color = Cyan, fontSize = 25.sp, fontWeight = FontWeight.ExtraBold)
                              }
                              Spacer(Modifier.height(10.dp))
                              Text("Profil tersimpan di perangkat ini. Sinkronisasi akun online belum tersedia.", color = Muted, fontSize = 10.sp, lineHeight = 15.sp)
                              Spacer(Modifier.height(12.dp))
                              OutlinedButton(
                                  onClick = {
                                      editedMemberName = memberName
                                      showAccountEditor = true
                                  },
                                  modifier = Modifier.fillMaxWidth(),
                                  colors = ButtonDefaults.outlinedButtonColors(contentColor = Cyan),
                                  border = androidx.compose.foundation.BorderStroke(1.dp, Cyan)
                              ) {
                                  Text("UBAH NAMA PROFIL", fontSize = 11.sp, fontWeight = FontWeight.Bold)
                              }
                          }
                      }

                      Spacer(Modifier.height(25.dp))
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Text("KEBIJAKAN & PRIVASI", color = Color.White, fontSize = 13.sp, fontWeight = FontWeight.Bold)
                          Spacer(Modifier.weight(1f))
                          Text("Informasi aplikasi", color = Muted, fontSize = 10.sp)
                      }
                      Spacer(Modifier.height(12.dp))

                      Card(
                          modifier = Modifier.fillMaxWidth(),
                          shape = RoundedCornerShape(20.dp),
                          colors = CardDefaults.cardColors(containerColor = Color(0xFF102238))
                      ) {
                          Column(modifier = Modifier.padding(17.dp)) {
                              Text("Privasi Anda penting", color = Cyan, fontSize = 15.sp, fontWeight = FontWeight.Bold)
                              Spacer(Modifier.height(8.dp))
                              Text(
                                  "M Asisten menggunakan izin hanya untuk menjalankan fitur yang Anda pilih.",
                                  color = Color.White, fontSize = 12.sp, lineHeight = 19.sp
                              )
                              Spacer(Modifier.height(12.dp))
                              Text("• Mikrofon", color = Color.White, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                              Text(
                                  "Digunakan saat Anda menekan widget mikrofon untuk menerima perintah suara. Pengenalan suara diproses melalui layanan pengenal suara Android yang tersedia di perangkat; ketentuan layanan tersebut dapat berlaku.",
                                  color = Muted, fontSize = 11.sp, lineHeight = 17.sp
                              )
                              Spacer(Modifier.height(10.dp))
                              Text("• Kamera", color = Color.White, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                              Text(
                                  "Izin kamera diperlukan untuk mengendalikan lampu flash/senter. Aplikasi tidak mengaktifkan kamera untuk mengambil foto atau video melalui fitur ini.",
                                  color = Muted, fontSize = 11.sp, lineHeight = 17.sp
                              )
                              Spacer(Modifier.height(10.dp))
                              Text("• Tampil di atas aplikasi lain", color = Color.White, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                              Text(
                                  "Digunakan untuk menampilkan widget mikrofon mengambang. Anda dapat menonaktifkan izin ini kapan saja melalui Pengaturan Android.",
                                  color = Muted, fontSize = 11.sp, lineHeight = 17.sp
                              )
                              Spacer(Modifier.height(10.dp))
                              Text("• Kendali pengguna", color = Color.White, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                              Text(
                                  "Widget hanya mulai mendengarkan setelah Anda mengetuknya. Anda dapat mencabut izin mikrofon, kamera, notifikasi, atau overlay melalui Pengaturan perangkat.",
                                  color = Muted, fontSize = 11.sp, lineHeight = 17.sp
                              )
                              Spacer(Modifier.height(10.dp))
                              Text(
                                  "Profil anggota saat ini disimpan hanya di perangkat. Akun online, pencadangan, dan sinkronisasi antarperangkat belum tersedia. Penggunaan layanan Android atau aplikasi lain yang dibuka melalui perintah suara mengikuti kebijakan privasi penyedia masing-masing.",
                                  color = Muted, fontSize = 10.sp, lineHeight = 16.sp
                              )
                          }
                      }

                      Spacer(Modifier.height(25.dp))
                      Text(
                          "M Asisten",
                          color = Cyan,
                          fontSize = 12.sp,
                          fontWeight = FontWeight.Bold
                      )
                      Spacer(Modifier.height(5.dp))
                      Text(
                          "Smart  •  Voice  •  Assistant",
                          color = Muted,
                          fontSize = 10.sp
                      )
                      Spacer(Modifier.height(12.dp))
                  }
                  if (showAccountEditor) {
                      AlertDialog(
                          onDismissRequest = { showAccountEditor = false },
                          containerColor = Panel,
                          title = {
                              Text("PROFIL ANGGOTA", color = Cyan, fontWeight = FontWeight.ExtraBold)
                          },
                          text = {
                              Column {
                                  Text("ID anggota perangkat", color = Muted, fontSize = 11.sp)
                                  Spacer(Modifier.height(4.dp))
                                  Text(memberId, color = Color.White, fontWeight = FontWeight.Bold)
                                  Spacer(Modifier.height(14.dp))
                                  OutlinedTextField(
                                      value = editedMemberName,
                                      onValueChange = { editedMemberName = it.take(32) },
                                      label = { Text("Nama profil") },
                                      singleLine = true,
                                      colors = OutlinedTextFieldDefaults.colors(
                                          focusedBorderColor = Cyan,
                                          focusedLabelColor = Cyan,
                                          cursorColor = Cyan
                                      )
                                  )
                                  Spacer(Modifier.height(8.dp))
                                  Text("Nama dan ID ini hanya tersimpan di perangkat ini, belum menjadi akun online.", color = Muted, fontSize = 10.sp, lineHeight = 15.sp)
                              }
                          },
                          confirmButton = {
                              TextButton(
                                  onClick = {
                                      val cleanName = editedMemberName.trim()
                                      if (cleanName.isNotEmpty()) {
                                          memberName = cleanName
                                          accountPrefs.edit().putString("display_name", cleanName).apply()
                                      }
                                      showAccountEditor = false
                                  }
                              ) {
                                  Text("SIMPAN", color = Cyan, fontWeight = FontWeight.Bold)
                              }
                          },
                          dismissButton = {
                              TextButton(onClick = { showAccountEditor = false }) {
                                  Text("BATAL", color = Muted)
                              }
                          }
                      )
                  }
                  if (showVipPlus) {
                      AlertDialog(
                          onDismissRequest = { showVipPlus = false },
                          containerColor = Panel,
                          title = {
                              Text(
                                  "VIP+ MEMBERSHIP",
                                  color = Cyan,
                                  fontWeight = FontWeight.ExtraBold
                              )
                          },
                          text = {
                              Column(
                                  modifier = Modifier
                                      .heightIn(max = 440.dp)
                                      .verticalScroll(rememberScrollState())
                              ) {
                                  Text(
                                      "Pengalaman lebih nyaman, dengan dukungan untuk pengembangan M Asisten.",
                                      color = Color.White,
                                      fontSize = 14.sp,
                                      fontWeight = FontWeight.SemiBold,
                                      lineHeight = 20.sp
                                  )
                                  Spacer(Modifier.height(14.dp))
                                  Card(
                                      modifier = Modifier.fillMaxWidth(),
                                      colors = CardDefaults.cardColors(containerColor = Color(0xFF0D2932)),
                                      shape = RoundedCornerShape(12.dp)
                                  ) {
                                      Row(
                                          modifier = Modifier.fillMaxWidth().padding(12.dp),
                                          verticalAlignment = Alignment.CenterVertically
                                      ) {
                                          Column {
                                              Text("STATUS KEANGGOTAAN", color = Muted, fontSize = 10.sp, fontWeight = FontWeight.Bold)
                                              Spacer(Modifier.height(3.dp))
                                              Text("Belum ada keanggotaan aktif", color = Color.White, fontSize = 11.sp)
                                          }
                                          Spacer(Modifier.weight(1f))
                                          Text("BELUM AKTIF", color = Cyan, fontSize = 10.sp, fontWeight = FontWeight.ExtraBold)
                                      }
                                  }
                                  Spacer(Modifier.height(15.dp))
                                  Text("KEUNTUNGAN VIP+", color = Cyan, fontSize = 11.sp, fontWeight = FontWeight.Bold)
                                  Spacer(Modifier.height(8.dp))
                                  listOf(
                                      "Pengalaman bebas iklan saat sistem iklan resmi diluncurkan",
                                      "Akses ke fitur eksklusif VIP+ yang dirilis bertahap",
                                      "Dukungan untuk pengembangan M Asisten"
                                  ).forEach { benefit ->
                                      Row(
                                          modifier = Modifier.fillMaxWidth().padding(vertical = 4.dp),
                                          verticalAlignment = Alignment.Top
                                      ) {
                                          Text("✓", color = Cyan, fontSize = 14.sp, fontWeight = FontWeight.ExtraBold)
                                          Spacer(Modifier.width(8.dp))
                                          Text(benefit, color = Color.White, fontSize = 12.sp, lineHeight = 18.sp)
                                      }
                                  }
                                  Spacer(Modifier.height(14.dp))
                                  Text("PILIHAN PAKET", color = Cyan, fontSize = 11.sp, fontWeight = FontWeight.Bold)
                                  Spacer(Modifier.height(7.dp))
                                  listOf("VIP+ Bulanan", "VIP+ Tahunan", "VIP+ Lifetime").forEach { plan ->
                                      Card(
                                          modifier = Modifier
                                              .fillMaxWidth()
                                              .padding(vertical = 4.dp)
                                              .clickable { selectedVipPlan = plan },
                                          colors = CardDefaults.cardColors(
                                              containerColor = if (selectedVipPlan == plan) Color(0xFF164354) else Color(0xFF172B42)
                                          ),
                                          border = if (selectedVipPlan == plan) androidx.compose.foundation.BorderStroke(1.dp, Cyan) else null,
                                          shape = RoundedCornerShape(12.dp)
                                      ) {
                                          Row(
                                              modifier = Modifier.fillMaxWidth().padding(12.dp),
                                              verticalAlignment = Alignment.CenterVertically
                                          ) {
                                              Text(plan, color = Color.White, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                                              Spacer(Modifier.weight(1f))
                                              Text(if (selectedVipPlan == plan) "DIPILIH" else "Harga menyusul", color = if (selectedVipPlan == plan) Cyan else Muted, fontSize = 10.sp)
                                          }
