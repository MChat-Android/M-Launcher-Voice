              }

              private fun openHotspotSettings() {
                  val actions = listOf(
                      "android.settings.TETHER_SETTINGS",
                      "android.settings.WIRELESS_SETTINGS"
                  )

                  for (action in actions) {
                      try {
                          startActivity(
                              Intent(action).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          )
                       return
                      } catch (_: Exception) {
                          // Try the next supported settings screen.
                      }
                  }
                  showMessage("Pengaturan hotspot tidak dapat dibuka")
              }

              private fun setScreenBrightnessPercent(percent: Int) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M &&
                      !Settings.System.canWrite(this)
                  ) {
                      showMessage("Izinkan M Asisten mengubah kecerahan layar")
                      val permissionIntent = Intent(
                          Settings.ACTION_MANAGE_WRITE_SETTINGS,
                          Uri.parse("package:$packageName")
                      ).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      try {
                          startActivity(permissionIntent)
                      } catch (_: Exception) {
                          showMessage("Izin perubahan kecerahan tidak dapat dibuka")
                      }
                      return
                  }

                  try {
                      val safePercent = percent.coerceIn(0, 100)
                      val target = (safePercent * 255 / 100.0).toInt().coerceIn(10, 255)
                      Settings.System.putInt(
                          contentResolver,
                          Settings.System.SCREEN_BRIGHTNESS_MODE,
                          Settings.System.SCREEN_BRIGHTNESS_MODE_MANUAL
                      )
                      val saved = Settings.System.putInt(
                          contentResolver,
                          Settings.System.SCREEN_BRIGHTNESS,
                          target
                      )
                      if (saved) {
                          showMessage("Kecerahan layar diatur ke $safePercent persen")
                      } else {
                          showMessage("Kecerahan tidak berhasil diubah")
                      }
                  } catch (_: Exception) {
                      showMessage("Kecerahan tidak dapat diubah. Periksa izin aplikasi.")
                  }
              }

              private fun adjustScreenBrightness(change: Int) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M &&
                      !Settings.System.canWrite(this)
                  ) {
                      showMessage("Izinkan M Asisten mengubah kecerahan layar")
                      val permissionIntent = Intent(
                          Settings.ACTION_MANAGE_WRITE_SETTINGS,
                          Uri.parse("package:$packageName")
                      ).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      try {
                          startActivity(permissionIntent)
                      } catch (_: Exception) {
                          showMessage("Izin perubahan kecerahan tidak dapat dibuka")
                      }
                      return
                  }

                  try {
                      val current = Settings.System.getInt(
                          contentResolver,
                          Settings.System.SCREEN_BRIGHTNESS,
                          128
                      )
                      val updated = (current + change).coerceIn(10, 255)
                      Settings.System.putInt(
                          contentResolver,
                          Settings.System.SCREEN_BRIGHTNESS_MODE,
                          Settings.System.SCREEN_BRIGHTNESS_MODE_MANUAL
                      )
                      val saved = Settings.System.putInt(
                          contentResolver,
                          Settings.System.SCREEN_BRIGHTNESS,
                          updated
                      )
                      if (saved) {
                          showMessage(
                              if (change > 0) "Kecerahan layar dinaikkan"
                              else "Kecerahan layar diturunkan"
                          )
                      } else {
                          showMessage("Kecerahan tidak berhasil diubah")
                      }
                  } catch (_: Exception) {
                      showMessage("Kecerahan tidak dapat diubah. Periksa izin aplikasi.")
                  }
              }

              private fun openSettings(action: String) {
                  try {
                      startActivity(
                          Intent(action).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      )
                  } catch (e: Exception) {
                      showMessage("Pengaturan tidak dapat dibuka")
                  }
              }

              private fun isBuiltInSystemApp(packageNameToCheck: String): Boolean {
                  return try {
                      val info = if (Build.VERSION.SDK_INT >= 33) {
                          packageManager.getApplicationInfo(
                              packageNameToCheck,
                              PackageManager.ApplicationInfoFlags.of(0)
                          )
                      } else {
                          @Suppress("DEPRECATION")
                          packageManager.getApplicationInfo(packageNameToCheck, 0)
                      }
                      val systemFlags = android.content.pm.ApplicationInfo.FLAG_SYSTEM or
                          android.content.pm.ApplicationInfo.FLAG_UPDATED_SYSTEM_APP
                      (info.flags and systemFlags) != 0
                  } catch (_: Exception) {
                      false
                  }
              }

              private fun launchVipApp(intent: Intent) {
                  val user = FirebaseAuth.getInstance().currentUser
                  if (user == null) {
                      showMessage("Aplikasi ini khusus VIP+. Hubungkan akun Google dan aktifkan VIP+.")
                      return
                  }

                  showMessage("Memeriksa akses VIP+...")
                  FirebaseFirestore.getInstance()
                      .collection("vip_members")
                      .document(user.uid)
                      .get()
                      .addOnSuccessListener { member ->
                          val expiresAt = member.getTimestamp("expiresAt")?.toDate()?.time
                          val vipActive = member.getString("membershipStatus") == "ACTIVE" &&
                              (expiresAt == null || expiresAt > System.currentTimeMillis())
                          if (vipActive) {
                              try {
                                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                  startActivity(intent)
                              } catch (_: Exception) {
                                  showMessage("Aplikasi tidak dapat dibuka")
                              }
                          } else {
                              showMessage("Aplikasi ini khusus VIP+. Aktifkan VIP+ untuk membukanya.")
                          }
                      }
                      .addOnFailureListener {
                          showMessage("Akses VIP+ belum dapat diverifikasi. Periksa koneksi internet.")
                      }
              }

              private fun launchIntent(intent: Intent) {
                  try {
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      val resolved = packageManager.resolveActivity(
                          intent,
                          PackageManager.MATCH_DEFAULT_ONLY
                      )
                      val targetPackage = resolved?.activityInfo?.packageName
                      if (targetPackage.isNullOrBlank()) {
                          showMessage("Aplikasi tidak ditemukan")
                          return
                      }

                      if (targetPackage == packageName || isBuiltInSystemApp(targetPackage)) {
                          startActivity(intent)
                      } else {
                          launchVipApp(intent)
                      }
                  } catch (_: Exception) {
                      showMessage("Aplikasi tidak ditemukan")
                  }
              }

              private fun openAppByName(vararg names: String): Boolean {
                  return try {
                      val intent = Intent(Intent.ACTION_MAIN).apply {
                          addCategory(Intent.CATEGORY_LAUNCHER)
                      }

                      val apps = if (Build.VERSION.SDK_INT >= 33) {
                          packageManager.queryIntentActivities(
                              intent,
                              PackageManager.ResolveInfoFlags.of(0L)
                          )
                      } else {
                          @Suppress("DEPRECATION")
                          packageManager.queryIntentActivities(intent, 0)
                      }
                      val aliases = names.map {
                          it.lowercase(Locale("id", "ID"))
                              .replace(Regex("[^a-z0-9 ]"), " ")
                              .replace(Regex("\\s+"), " ")
                              .trim()
                      }.filter { it.length >= 3 }
                      val matched = apps.mapNotNull { app ->
                          val targetPackage = app.activityInfo.packageName
                          if (targetPackage == packageName ||
                              (!vipMode && !isBuiltInSystemApp(targetPackage))
                          ) {
                              null
                          } else {
                              val label = app.loadLabel(packageManager).toString()
                                  .lowercase(Locale("id", "ID"))
                                  .replace(Regex("[^a-z0-9 ]"), " ")
                                  .replace(Regex("\\s+"), " ")
                                  .trim()
                              val score = when {
                                  aliases.any { label == it } -> 0
                                  aliases.any { label.startsWith(it) } -> 1
                                  aliases.any { label.contains(it) } -> 2
                                  aliases.any { it.contains(label) && label.length >= 3 } -> 3
                                  else -> null
                              }
                              if (score == null) null else app to score
                          }
                      }.sortedBy { it.second }.firstOrNull()?.first

                      if (matched != null) {
                          // Jalankan komponen launcher yang benar-benar ditemukan, bukan menebak nama paket.
                          val launch = Intent(Intent.ACTION_MAIN).apply {
                              addCategory(Intent.CATEGORY_LAUNCHER)
                              setClassName(
                                  matched.activityInfo.packageName,
                                  matched.activityInfo.name
                              )
                              addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          }
                          launchIntent(launch)
                          true
                      } else false
                  } catch (_: Exception) {
                      false
                  }
              }

              private fun controlTorch(turnOn: Boolean) {
                  if (checkSelfPermission(Manifest.permission.CAMERA)
                      != PackageManager.PERMISSION_GRANTED
                  ) {
                      showMessage("Izin kamera belum diberikan")
                      return
                  }

                  try {
                      val cameraManager =
                          getSystemService(CAMERA_SERVICE) as CameraManager

                      val cameraId = cameraManager.cameraIdList.firstOrNull {
                          cameraManager.getCameraCharacteristics(it).get(
                              CameraCharacteristics.FLASH_INFO_AVAILABLE
                          ) == true
                      }

                      if (cameraId == null) {
                          showMessage("Senter tidak tersedia")
                          return
                      }

                      cameraManager.setTorchMode(cameraId, turnOn)
                      showMessage(
                          if (turnOn) "Senter dinyalakan" else "Senter dimatikan"
                      )
                  } catch (e: Exception) {
                      showMessage("Senter tidak dapat digunakan")
                  }
              }

              override fun onDestroy() {
                  stopCurrentMode()
                  serviceInitialized = false
                  super.onDestroy()
              }
          }
          EOF
          
      - name: Configure Firebase Android
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
            python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("app/google-services.json").read_text())
          packages = [c.get("client_info", {}).get("android_client_info", {}).get("package_name") for c in config.get("client", [])]
          if "com.m.launchervoice" not in packages:
              raise SystemExit("Firebase config tidak memiliki package com.m.launchervoice")
          print("Firebase config valid untuk M Asisten.")
          PY
          else
            echo "Secret Firebase belum dipasang; build tetap berjalan tanpa konfigurasi Firebase."
          fi

      - name: Generate Launcher Icons
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Path("launcher_icon.png")

          if not source.exists():
              raise SystemExit("launcher_icon.png tidak ditemukan!")

          image = Image.open(source).convert("RGBA")

          # Simpan sumber resolusi tinggi untuk logo besar di halaman beranda.
          home_icon_dir = Path("app/src/main/res/drawable-nodpi")
          home_icon_dir.mkdir(parents=True, exist_ok=True)
          image.save(home_icon_dir / "launcher_home.png", optimize=True)

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192,
          }

          for density, size in sizes.items():
              folder = Path("app/src/main/res") / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              resized = image.resize((size, size), Image.Resampling.LANCZOS)
              resized.save(folder / "ic_launcher.png", optimize=True)
          PY

      - name: Decode Release Keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEYSTORE_BASE64"
          test -n "$SIGNING_STORE_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mlauncher-release.jks"
          test -s "$RUNNER_TEMP/mlauncher-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/mlauncher-release.jks" -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS"

      - name: Build Signed Release APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/mlauncher-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Verify APK Signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

      - name: Prepare Download Filename
        run: |
          cp app/build/outputs/apk/release/app-release.apk masisten.apk
          test -s masisten.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: M-Asisten-APK
          path: masisten.apk
          if-no-files-found: error
