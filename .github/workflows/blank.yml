          </manifest>
          EOF

          cat > app/src/main/java/com/m/launchervoice/MainActivity.kt <<'EOF'
          package com.m.launchervoice

          import android.Manifest
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.content.Intent
          import android.net.Uri
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.speech.tts.TextToSpeech
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import com.google.android.gms.auth.api.signin.GoogleSignIn
          import com.google.android.gms.auth.api.signin.GoogleSignInOptions
          import com.google.android.gms.common.api.ApiException
          import com.google.android.gms.ads.AdError
          import com.google.android.gms.ads.AdRequest
          import com.google.android.gms.ads.FullScreenContentCallback
          import com.google.android.gms.ads.LoadAdError
          import com.google.android.gms.ads.MobileAds
          import com.google.android.gms.ads.rewarded.RewardedAd
          import com.google.android.gms.ads.rewarded.RewardedAdLoadCallback
          import com.google.firebase.auth.FirebaseAuth
          import com.google.firebase.auth.GoogleAuthProvider
          import com.google.firebase.firestore.FieldValue
          import com.google.firebase.firestore.FirebaseFirestore
          import androidx.compose.foundation.Image
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.res.painterResource
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.asImageBitmap
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.compose.ui.window.DialogProperties
          import java.util.Locale

          private val Navy = Color(0xFF07111F)
          private val Panel = Color(0xFF111F32)
          private val Cyan = Color(0xFF35D6E8)
          private val Blue = Color(0xFF397BFF)
          private val Muted = Color(0xFF9DB2C9)

          // Gunakan unit iklan uji resmi selama pengembangan. Ganti ke ID produksi
          // ca-app-pub-7565089304214703/2556159267 hanya setelah pengujian selesai dan aplikasi siap dipublikasikan.
          private const val REWARDED_AD_UNIT_ID = "ca-app-pub-3940256099942544/5224354917"

          object MAsistenTrial {
              const val DURATION_MS = 72L * 60L * 60L * 1000L
          }

          object MAsistenVoiceSettings {
              const val DEFAULT_WAKE_PHRASE = "Hallo M"

              fun normalize(value: String): String =
                  value.lowercase(Locale("id", "ID"))
                      .replace(Regex("[^a-z0-9 ]"), " ")
                      .replace(Regex("\\s+"), " ")
                      .trim()

              // Karakter suara tetap: pemuda energik.
              fun applyTo(context: android.content.Context, engine: TextToSpeech) {
                  engine.setPitch(0.94f)
                  engine.setSpeechRate(1.12f)
              }
          }

          // Hak VIP yang sudah diverifikasi disimpan agar tetap tersedia tanpa internet.
          // Cache terikat ke UID dan tidak boleh melewati masa berlaku membership.
          object VipEntitlementCache {
              private const val PREFS = "vip_entitlement_cache"
              private const val KEY_UID = "uid"
              private const val KEY_ACTIVE = "active"
              private const val KEY_ADMIN = "admin"
              private const val KEY_EXPIRES_AT = "expires_at"
              private const val KEY_VERIFIED_AT = "verified_at"
              private const val KEY_VERIFIED_ELAPSED = "verified_elapsed"
              private const val KEY_EXPIRES_ELAPSED = "expires_elapsed"
              private const val KEY_VERIFIED_BOOT = "verified_boot"
              private const val OFFLINE_GRACE_MS = 30L * 24L * 60L * 60L * 1000L

              private fun currentBootCount(context: android.content.Context): Int {
                  if (android.os.Build.VERSION.SDK_INT < android.os.Build.VERSION_CODES.N) return -1
                  return try {
                      android.provider.Settings.Global.getInt(
                          context.contentResolver,
                          android.provider.Settings.Global.BOOT_COUNT,
                          -1
                      )
                  } catch (_: Exception) {
                      -1
                  }
              }

              fun save(
                  context: android.content.Context,
                  uid: String,
                  active: Boolean,
                  expiresAt: Long = 0L,
                  admin: Boolean = false
              ) {
                  val prefs = context.getSharedPreferences(PREFS, android.content.Context.MODE_PRIVATE)
                  val previousUid = prefs.getString(KEY_UID, null)
                  val previousState = prefs.getString("last_notified_state", null)
                  if (previousUid == uid && previousState == "INACTIVE" && active) {
                      MAsistenNotifications.post(
                          context,
                          4201,
                          "VIP berhasil diaktifkan",
                          "Paket VIP Anda sudah aktif. Selamat menggunakan fitur VIP M Asisten."
                      )
                  }
                  val verifiedWallTime = System.currentTimeMillis()
                  val verifiedElapsed = android.os.SystemClock.elapsedRealtime()
                  val expiresElapsed = if (expiresAt > 0L) {
                      verifiedElapsed + (expiresAt - verifiedWallTime).coerceAtLeast(0L)
                  } else 0L
                  prefs.edit()
                      .putString(KEY_UID, uid)
                      .putBoolean(KEY_ACTIVE, active)
                      .putBoolean(KEY_ADMIN, admin)
                      .putLong(KEY_EXPIRES_AT, expiresAt)
                      .putLong(KEY_VERIFIED_AT, verifiedWallTime)
                      .putLong(KEY_VERIFIED_ELAPSED, verifiedElapsed)
                      .putLong(KEY_EXPIRES_ELAPSED, expiresElapsed)
                      .putInt(KEY_VERIFIED_BOOT, currentBootCount(context))
                      .putString("last_notified_state", if (active) "ACTIVE" else "INACTIVE")
                      .apply()
                  if (active && !admin && expiresAt > 0L) {
                      VipNotificationScheduler.schedule(context, uid, expiresAt)
                  } else {
                      VipNotificationScheduler.cancel(context)
                  }
              }

              fun clear(context: android.content.Context, uid: String? = null) {
                  val prefs = context.getSharedPreferences(PREFS, android.content.Context.MODE_PRIVATE)
                  if (uid == null || prefs.getString(KEY_UID, null) == uid) {
                      val wasActive = prefs.getBoolean(KEY_ACTIVE, false)
                      prefs.edit().clear().putString("last_notified_state", "INACTIVE").apply()
                      VipNotificationScheduler.cancel(context)
                      if (wasActive) {
                          MAsistenNotifications.post(
                              context,
                              4202,
                              "Masa VIP telah berakhir",
                              "Akses VIP tidak lagi aktif. Anda dapat memeriksa atau memperpanjang paket di M Asisten."
                          )
                      }
                  }
              }

              fun isActive(context: android.content.Context, uid: String): Boolean {
                  val prefs = context.getSharedPreferences(PREFS, android.content.Context.MODE_PRIVATE)
                  if (prefs.getString(KEY_UID, null) != uid || !prefs.getBoolean(KEY_ACTIVE, false)) {
                      return false
                  }
                  // Cache offline hanya berlaku pada boot yang sama. Setelah restart,
                  // pengguna wajib tersambung ke Firebase untuk verifikasi ulang.
                  val bootCount = currentBootCount(context)
                  val verifiedBoot = prefs.getInt(KEY_VERIFIED_BOOT, -1)
                  val verifiedElapsed = prefs.getLong(KEY_VERIFIED_ELAPSED, 0L)
                  val elapsedNow = android.os.SystemClock.elapsedRealtime()
                  // Android sebelum API 24 tidak menyediakan BOOT_COUNT yang dapat dibaca.
                  // Pada perangkat tersebut, elapsedRealtime tetap dipakai untuk mendeteksi
                  // restart karena nilainya kembali ke awal setelah perangkat dinyalakan ulang.
                  if (verifiedElapsed <= 0L || elapsedNow < verifiedElapsed ||
                      (bootCount >= 0 && verifiedBoot >= 0 && bootCount != verifiedBoot)) {
                      return false
                  }

                  val elapsedSinceVerification = elapsedNow - verifiedElapsed
                  val verifiedAt = prefs.getLong(KEY_VERIFIED_AT, 0L)
                  val expiresAt = prefs.getLong(KEY_EXPIRES_AT, 0L)
                  val expiresElapsed = prefs.getLong(KEY_EXPIRES_ELAPSED, 0L)
                  val notExpired = if (expiresAt > 0L) {
                      // Masa berlaku dihitung memakai jam monotonic agar memundurkan jam
                      // perangkat tidak dapat memperpanjang akses VIP offline.
                      expiresElapsed > 0L && elapsedNow < expiresElapsed
                  } else {
                      // VIP permanen tetap dibatasi grace offline sejak verifikasi terakhir.
                      true
                  }
                  return verifiedAt > 0L &&
                      elapsedSinceVerification <= OFFLINE_GRACE_MS &&
                      notExpired
              }

              fun isAdmin(context: android.content.Context, uid: String): Boolean {
                  // Custom Claims admin harus diverifikasi secara online pada sesi ini.
                  // Cache offline tidak boleh mempertahankan hak administrasi setelah pencabutan.
                  return false
              }

              fun expiry(context: android.content.Context, uid: String): Long {
                  val prefs = context.getSharedPreferences(PREFS, android.content.Context.MODE_PRIVATE)
                  return if (prefs.getString(KEY_UID, null) == uid) prefs.getLong(KEY_EXPIRES_AT, 0L) else 0L
              }
          }

          object MAsistenNotifications {
              const val UPDATE_CHANNEL = "m_asisten_updates"
              const val SERVICE_CHANNEL = "m_asisten_service"

              fun createChannels(context: android.content.Context) {
                  if (android.os.Build.VERSION.SDK_INT < android.os.Build.VERSION_CODES.O) return
                  val manager = context.getSystemService(android.app.NotificationManager::class.java)
                  manager.createNotificationChannel(
                      android.app.NotificationChannel(
                          UPDATE_CHANNEL,
                          "Pemberitahuan M Asisten",
                          android.app.NotificationManager.IMPORTANCE_DEFAULT
                      ).apply {
                          description = "Informasi paket VIP, pembayaran, dan pengingat masa berlaku"
                      }
                  )
                  manager.createNotificationChannel(
                      android.app.NotificationChannel(
                          SERVICE_CHANNEL,
                          "Layanan widget M Asisten",
                          android.app.NotificationManager.IMPORTANCE_LOW
                      ).apply {
                          description = "Status layanan widget mikrofon yang sedang berjalan"
                          setShowBadge(false)
                      }
                  )
              }

              fun post(context: android.content.Context, id: Int, title: String, body: String) {
                  createChannels(context)
                  val manager = context.getSystemService(android.app.NotificationManager::class.java)
                  if (!manager.areNotificationsEnabled()) return
                  if (android.os.Build.VERSION.SDK_INT >= 33 &&
                      context.checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) return
                  val openApp = Intent(context, MainActivity::class.java).apply {
                      flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                  }
                  val pendingFlags = android.app.PendingIntent.FLAG_UPDATE_CURRENT or
                      if (android.os.Build.VERSION.SDK_INT >= 23) android.app.PendingIntent.FLAG_IMMUTABLE else 0
                  val pending = android.app.PendingIntent.getActivity(context, id, openApp, pendingFlags)
                  val notification = android.app.Notification.Builder(context, UPDATE_CHANNEL)
                      .setSmallIcon(android.R.drawable.ic_dialog_info)
                      .setContentTitle(title)
                      .setContentText(body)
                      .setStyle(android.app.Notification.BigTextStyle().bigText(body))
                      .setContentIntent(pending)
                      .setAutoCancel(true)
                      .build()
                  manager.notify(id, notification)
              }
          }

          object VipNotificationScheduler {
              private const val PREFS = "vip_entitlement_cache"
              private const val KEY_UID = "uid"
              private const val KEY_EXPIRES_AT = "expires_at"
              private const val DAY_MS = 24L * 60L * 60L * 1000L
              private val requestCodes = intArrayOf(4100, 4101, 4102)

              fun schedule(context: android.content.Context, uid: String, expiresAt: Long) {
                  cancel(context)
                  if (expiresAt <= System.currentTimeMillis()) return
                  val alarms = context.getSystemService(android.content.Context.ALARM_SERVICE) as android.app.AlarmManager
                  val moments = longArrayOf(expiresAt - 3L * DAY_MS, expiresAt - DAY_MS, expiresAt)
                  val titles = arrayOf("VIP akan berakhir", "VIP berakhir besok", "Masa VIP berakhir")
                  val messages = arrayOf(
                      "Masa VIP Anda tersisa sekitar 3 hari.",
                      "Masa VIP Anda akan berakhir dalam sekitar 24 jam.",
                      "Masa VIP Anda telah mencapai tanggal berakhir. Periksa status paket di M Asisten."
                  )
                  for (i in moments.indices) {
                      if (moments[i] <= System.currentTimeMillis()) continue
                      val alarmIntent = Intent(context, VipNotificationReceiver::class.java).apply {
                          action = "com.m.launchervoice.VIP_EXPIRY_$i"
                          putExtra("uid", uid)
                          putExtra("expiresAt", expiresAt)
                          putExtra("title", titles[i])
                          putExtra("message", messages[i])
                      }
                      val flags = android.app.PendingIntent.FLAG_UPDATE_CURRENT or
                          if (android.os.Build.VERSION.SDK_INT >= 23) android.app.PendingIntent.FLAG_IMMUTABLE else 0
                      val pending = android.app.PendingIntent.getBroadcast(context, requestCodes[i], alarmIntent, flags)
                      alarms.setAndAllowWhileIdle(android.app.AlarmManager.RTC_WAKEUP, moments[i], pending)
                  }
              }

              fun cancel(context: android.content.Context) {
                  val alarms = context.getSystemService(android.content.Context.ALARM_SERVICE) as android.app.AlarmManager
                  for (i in requestCodes.indices) {
                      val alarmIntent = Intent(context, VipNotificationReceiver::class.java).apply {
                          action = "com.m.launchervoice.VIP_EXPIRY_$i"
                      }
                      val flags = android.app.PendingIntent.FLAG_NO_CREATE or
                          if (android.os.Build.VERSION.SDK_INT >= 23) android.app.PendingIntent.FLAG_IMMUTABLE else 0
                      val pending = android.app.PendingIntent.getBroadcast(context, requestCodes[i], alarmIntent, flags)
                      if (pending != null) {
                          alarms.cancel(pending)
                          pending.cancel()
                      }
                  }
              }

              fun restoreAfterBoot(context: android.content.Context) {
                  val prefs = context.getSharedPreferences(PREFS, android.content.Context.MODE_PRIVATE)
                  val uid = prefs.getString(KEY_UID, null) ?: return
                  if (!prefs.getBoolean("active", false)) return
                  val expiresAt = prefs.getLong(KEY_EXPIRES_AT, 0L)
                  if (expiresAt > System.currentTimeMillis()) schedule(context, uid, expiresAt)
              }
          }

          class VipNotificationReceiver : android.content.BroadcastReceiver() {
              override fun onReceive(context: android.content.Context, intent: Intent) {
                  val uid = intent.getStringExtra("uid") ?: return
                  val expiresAt = intent.getLongExtra("expiresAt", 0L)
                  val prefs = context.getSharedPreferences("vip_entitlement_cache", android.content.Context.MODE_PRIVATE)
                  if (prefs.getString("uid", null) != uid ||
                      !prefs.getBoolean("active", false) ||
                      prefs.getLong("expires_at", 0L) != expiresAt
                  ) return
                  val title = intent.getStringExtra("title") ?: "Informasi VIP"
                  val message = intent.getStringExtra("message") ?: "Periksa status VIP Anda di M Asisten."
                  val notificationId = when {
                      title.contains("akan berakhir") -> 4103
                      title.contains("besok") -> 4104
                      else -> 4105
                  }
                  MAsistenNotifications.post(context, notificationId, title, message)
              }
          }

          class VipNotificationBootReceiver : android.content.BroadcastReceiver() {
              override fun onReceive(context: android.content.Context, intent: Intent) {
                  if (intent.action == android.content.Intent.ACTION_BOOT_COMPLETED) {
                      VipNotificationScheduler.restoreAfterBoot(context)
                  }
              }
          }

          class MainActivity : ComponentActivity() {

              private var message by mutableStateOf("Silakan masuk untuk melanjutkan.")
              private var isAuthenticated by mutableStateOf(false)
              private var isGoogleSignInLoading by mutableStateOf(false)
              private var googleAccountName by mutableStateOf("")
              private var googleAccountEmail by mutableStateOf("")
              private var vipMembershipStatus by mutableStateOf("BELUM AKTIF")
              private var isAdminAccount by mutableStateOf(false)
              private var rewardedAd: RewardedAd? = null
              private var isAdLoading = false
              private var standardActivationPending = false
              private var standardRewardEarned = false
              private var standardWidgetStarter: (() -> Unit)? = null

              private val voiceMessageReceiver = object : android.content.BroadcastReceiver() {
                  override fun onReceive(context: android.content.Context?, intent: Intent?) {
                      message = intent?.getStringExtra("message").orEmpty().ifBlank { message }
                  }
              }

              private val googleSignInLauncher = registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { result ->
                  if (result.resultCode == RESULT_OK) {
                      try {
                          val account = GoogleSignIn.getSignedInAccountFromIntent(result.data).getResult(ApiException::class.java)
                          val token = account.idToken
                          if (token.isNullOrBlank()) {
                              message = "Token Google tidak tersedia. Periksa konfigurasi OAuth Firebase."
                          } else {
                              FirebaseAuth.getInstance().signInWithCredential(GoogleAuthProvider.getCredential(token, null))
                                  .addOnSuccessListener { authResult ->
                                      val user = authResult.user
                                      if (user == null) {
                                          isGoogleSignInLoading = false
                                          message = "Login Google gagal membaca akun."
                                      } else {
                                          isAuthenticated = true
                                          isGoogleSignInLoading = false
                                          refreshAdminClaim(user)
                                          googleAccountName = user.displayName ?: account.displayName ?: "Pengguna M Asisten"
                                          googleAccountEmail = user.email ?: account.email.orEmpty()
                                          val memberRef = FirebaseFirestore.getInstance().collection("vip_members").document(user.uid)
                                          memberRef.get()
                                              .addOnSuccessListener { existing ->
                                                  val profileData = hashMapOf<String, Any>(
                                                      "uid" to user.uid, "email" to googleAccountEmail,
                                                      "displayName" to googleAccountName, "provider" to "google",
                                                      "lastLoginAt" to FieldValue.serverTimestamp(),
                                                      "updatedAt" to FieldValue.serverTimestamp()
                                                  )
                                                  if (existing.exists()) {
                                                      memberRef.update(profileData as Map<String, Any>)
                                                          .addOnSuccessListener {
                                                              message = "Akun Google berhasil terhubung."
                                                              loadVipMembership(user.uid)
                                                          }
                                                          .addOnFailureListener { err -> message = "Pembaruan akun gagal: " + err.localizedMessage }
                                                  } else {
                                                      // Status keanggotaan hanya boleh ditetapkan oleh server.
                                                      // Dokumen awal hanya berisi profil Google yang diizinkan Firestore Rules.
                                                      memberRef.set(profileData)
                                                          .addOnSuccessListener {
                                                              message = "Akun Google berhasil terhubung."
                                                              loadVipMembership(user.uid)
                                                          }
                                                          .addOnFailureListener { err -> message = "Pembuatan profil VIP gagal: " + err.localizedMessage }
                                                  }
                                              }
                                              .addOnFailureListener { err -> message = "Sinkronisasi VIP gagal: " + err.localizedMessage }
                                      }
                                  }
                                  .addOnFailureListener { err ->
                                      isGoogleSignInLoading = false
                                      message = "Login Firebase gagal: " + err.localizedMessage
                                  }
                          }
                      } catch (err: ApiException) {
                          isGoogleSignInLoading = false
                          message = "Login Google gagal (kode " + err.statusCode + ")."
                      } catch (err: Exception) {
                          isGoogleSignInLoading = false
                          message = "Gagal memproses akun Google: " + err.localizedMessage
                      }
                  } else {
                      isGoogleSignInLoading = false
                      message = "Login Google dibatalkan."
                  }
              }

              private fun startGoogleSignIn() {
                  if (isGoogleSignInLoading) return
                  val id = resources.getIdentifier("default_web_client_id", "string", packageName)
                  if (id == 0) {
                      isGoogleSignInLoading = false
                      message = "OAuth Google belum dikonfigurasi di Firebase."
                      return
                  }
                  val options = GoogleSignInOptions.Builder(GoogleSignInOptions.DEFAULT_SIGN_IN)
                      .requestEmail().requestIdToken(getString(id)).build()
                  try {
                      googleSignInLauncher.launch(GoogleSignIn.getClient(this, options).signInIntent)
                  } catch (err: Exception) {
                      isGoogleSignInLoading = false
                      message = "Tidak dapat membuka login Google: " + err.localizedMessage
                  }
              }

              private fun refreshAdminClaim(user: com.google.firebase.auth.FirebaseUser) {
                  user.getIdToken(true)
                      .addOnSuccessListener { token ->
                          isAdminAccount = token.claims["admin"] == true
                          if (isAdminAccount) {
                              VipEntitlementCache.save(this, user.uid, true, 0L, true)
                              vipMembershipStatus = "VIP AKTIF • ADMIN"
                          }
                      }
                      .addOnFailureListener { isAdminAccount = false }
              }

              private fun loadVipMembership(uid: String) {
                  val user = FirebaseAuth.getInstance().currentUser
                  if (user == null || user.uid != uid) {
                      vipMembershipStatus = "BELUM AKTIF"
                      isAdminAccount = false
                      return
                  }

                  user.getIdToken(true)
                      .addOnSuccessListener { token ->
                          val admin = token.claims["admin"] == true
                          isAdminAccount = admin
                          if (admin) {
                              // Hak VIP admin berasal dari Custom Claims, tidak dari dokumen pembayaran.
                              VipEntitlementCache.save(this, uid, true, 0L, true)
                              vipMembershipStatus = "VIP AKTIF • ADMIN"
                          } else {
                              loadRegularVipMembership(uid)
                          }
                      }
                      .addOnFailureListener {
                          isAdminAccount = false
                          loadRegularVipMembership(uid)
                      }
              }

              private fun loadRegularVipMembership(uid: String) {
                  FirebaseFirestore.getInstance().collection("vip_members").document(uid)
                      .get(com.google.firebase.firestore.Source.SERVER)
                      .addOnSuccessListener { snap ->
                          val status = snap.getString("membershipStatus") ?: "FREE"
                          val expiresAt = snap.getTimestamp("expiresAt")?.toDate()?.time ?: 0L
                          val active = status == "ACTIVE" &&
                              ((expiresAt == 0L && snap.getString("membershipPlan") == "VIP Permanen") || expiresAt > System.currentTimeMillis())
                          VipEntitlementCache.save(this, uid, active, expiresAt, false)
                          if (active) {
                              vipMembershipStatus = "VIP AKTIF"
                          } else {
                              resolveTrialEntitlement(uid, false) { trialActive, _ ->
                                  vipMembershipStatus = if (trialActive) "TRIAL AKTIF" else "PAKET STANDAR"
                              }
                          }
                      }
                      .addOnFailureListener {
                          val cached = VipEntitlementCache.isActive(this, uid)
                          vipMembershipStatus = if (cached) "VIP AKTIF • OFFLINE" else "PAKET STANDAR"
                      }
              }

              private fun currentTrialDeviceId(): String {
                  return Settings.Secure.getString(contentResolver, Settings.Secure.ANDROID_ID)
                      .orEmpty()
                      .takeIf { it.matches(Regex("^[A-Za-z0-9_-]{16,64}$")) }
                      .orEmpty()
              }

                  private fun fetchTrustedServerTime(uid: String, callback: (Long) -> Unit) {
                      val clockRef = FirebaseFirestore.getInstance().collection("trial_clock").document(uid)
                      clockRef.set(mapOf("serverTime" to FieldValue.serverTimestamp()))
                          .addOnSuccessListener {
                              clockRef.get(com.google.firebase.firestore.Source.SERVER)
                                  .addOnSuccessListener { clock -> callback(clock.getTimestamp("serverTime")?.toDate()?.time ?: 0L) }
                                  .addOnFailureListener { callback(0L) }
                          }
                          .addOnFailureListener { callback(0L) }
                  }

              private fun resolveTrialEntitlement(
                  uid: String,
                  startIfMissing: Boolean,
                  callback: (Boolean, Long) -> Unit
              ) {
                  val deviceId = currentTrialDeviceId()
                  if (deviceId.isBlank()) {
                      callback(false, 0L)
                      return
                  }

                  val db = FirebaseFirestore.getInstance()
                  val trialRef = db.collection("trial_entitlements").document(uid)

                  fun deliver(snapshot: com.google.firebase.firestore.DocumentSnapshot) {
                      val storedDeviceId = snapshot.getString("deviceId").orEmpty()
                      val startedAt = snapshot.getTimestamp("startedAt")?.toDate()?.time ?: 0L
                      val expiresAt = if (startedAt > 0L) startedAt + MAsistenTrial.DURATION_MS else 0L
                      fetchTrustedServerTime(uid) { serverNow ->
                          callback(serverNow > 0L && snapshot.exists() && storedDeviceId == deviceId && expiresAt > serverNow, expiresAt)
                      }
                  }

                  trialRef.get(com.google.firebase.firestore.Source.SERVER)
                      .addOnSuccessListener { existing ->
                          if (existing.exists()) {
                              deliver(existing)
                          } else if (!startIfMissing) {
                              callback(false, 0L)
                          } else {
                              val deviceRef = db.collection("trial_devices").document(deviceId)
                              deviceRef.get(com.google.firebase.firestore.Source.SERVER)
                                  .addOnSuccessListener { device ->
                                      if (device.exists()) {
                                          callback(false, 0L)
                                      } else {
                                          val batch = db.batch()
                                          batch.set(deviceRef, mapOf(
                                              "uid" to uid,
                                              "deviceId" to deviceId,
                                              "startedAt" to FieldValue.serverTimestamp()
                                          ))
                                          batch.set(trialRef, mapOf(
                                              "uid" to uid,
                                              "deviceId" to deviceId,
                                              "startedAt" to FieldValue.serverTimestamp()
                                          ))
                                          batch.commit()
                                              .addOnSuccessListener {
                                                  trialRef.get(com.google.firebase.firestore.Source.SERVER)
                                                      .addOnSuccessListener { created -> deliver(created) }
                                                      .addOnFailureListener { callback(false, 0L) }
                                              }
                                              .addOnFailureListener {
                                                  // A competing account/device claim wins; never restart the trial.
                                                  trialRef.get(com.google.firebase.firestore.Source.SERVER)
                                                      .addOnSuccessListener { raced -> deliver(raced) }
                                                      .addOnFailureListener { callback(false, 0L) }
                                              }
                                      }
                                  }
                                  .addOnFailureListener { callback(false, 0L) }
                          }
                      }
                      .addOnFailureListener { callback(false, 0L) }
              }

