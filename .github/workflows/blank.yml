          import com.google.firebase.firestore.FirebaseFirestore

          class FloatingVoiceService : Service() {

              companion object {
                  const val EXTRA_MODE = "com.m.launchervoice.EXTRA_WIDGET_MODE"
                  const val MODE_STANDARD = "standard"
                  const val MODE_VIP = "vip"
              }

              private var vipMode = false
              private var serviceInitialized = false
              private var modeVerificationRequest = 0
              private var membershipListener: com.google.firebase.firestore.ListenerRegistration? = null
              private var trialListener: com.google.firebase.firestore.ListenerRegistration? = null
              private var trialExpiryRunnable: Runnable? = null
              private lateinit var windowManager: WindowManager
              private lateinit var container: FrameLayout
              private lateinit var micButton: View
              private var speechRecognizer: SpeechRecognizer? = null
              private var textToSpeech: TextToSpeech? = null
              private var textToSpeechReady = false
              private var vipGreetingPending = false
              private var pendingSpeechResponse: String? = null
              private val handler = Handler(Looper.getMainLooper())
              private var listening = false
              private var awaitingWakeWord = true
              private var vipWakeLock: android.os.PowerManager.WakeLock? = null
              private val vipIdleTimeoutMs = 5 * 60 * 1000L
              private var vipIdleTimeoutRunnable: Runnable? = null
              private var audioDeviceCallback: AudioDeviceCallback? = null
              private var audioRouteRestartRunnable: Runnable? = null

              private lateinit var layoutParams: WindowManager.LayoutParams

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  registerAudioDeviceMonitoring()
              }

              // Android sendiri memilih mikrofon dan keluaran headset yang aktif.
              // Saat perangkat kabel/Bluetooth/USB berubah, sesi pengenalan suara
              // dibuka ulang agar SpeechRecognizer mengambil rute audio terbaru.
              private fun registerAudioDeviceMonitoring() {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.M || audioDeviceCallback != null) return
                  try {
                      val audioManager = getSystemService(AUDIO_SERVICE) as AudioManager
                      val callback = object : AudioDeviceCallback() {
                          override fun onAudioDevicesAdded(addedDevices: Array<out AudioDeviceInfo>) {
                              scheduleAudioRouteRefresh()
                          }

                          override fun onAudioDevicesRemoved(removedDevices: Array<out AudioDeviceInfo>) {
                              scheduleAudioRouteRefresh()
                          }
                      }
                      audioDeviceCallback = callback
                      audioManager.registerAudioDeviceCallback(callback, handler)
                  } catch (_: Exception) {
                      audioDeviceCallback = null
                  }
              }

              private fun scheduleAudioRouteRefresh() {
                  if (!serviceInitialized) return
                  audioRouteRestartRunnable?.let { handler.removeCallbacks(it) }
                  val refresh = Runnable {
                      if (!serviceInitialized || !listening) return@Runnable
                      // Simpan status wake-word/perintah yang sedang ditunggu.
                      // Jangan mengubah mode Standard/VIP atau status keanggotaan.
                      listening = false
                      try { speechRecognizer?.cancel() } catch (_: Exception) {}
                      try { speechRecognizer?.destroy() } catch (_: Exception) {}
                      speechRecognizer = null
                      startVoiceRecognition()
                  }
                  audioRouteRestartRunnable = refresh
                  handler.postDelayed(refresh, 900L)
              }

              private fun unregisterAudioDeviceMonitoring() {
                  audioRouteRestartRunnable?.let { handler.removeCallbacks(it) }
                  audioRouteRestartRunnable = null
                  val callback = audioDeviceCallback ?: return
                  try {
                      val audioManager = getSystemService(AUDIO_SERVICE) as AudioManager
                      audioManager.unregisterAudioDeviceCallback(callback)
                  } catch (_: Exception) {}
                  audioDeviceCallback = null
              }

              override fun onStartCommand(
                  intent: Intent?,
                  flags: Int,
                  startId: Int
              ): Int {
                  val preferences = getSharedPreferences("m_widget_mode", MODE_PRIVATE)
                  val requestedMode = intent?.getStringExtra(EXTRA_MODE)
                      ?: preferences.getString("active_mode", MODE_STANDARD)
                      ?: MODE_STANDARD

                  // Jangan pulihkan mode VIP hanya dari preferensi lokal.
                  // Setiap aktivasi dan pemulihan service wajib diverifikasi ke Firestore server.
                  val verificationId = ++modeVerificationRequest
                  if (requestedMode != MODE_VIP) {
                      configureMode(false)
                      return START_STICKY
                  }

                  val user = FirebaseAuth.getInstance().currentUser
                  if (user == null) {
                      configureMode(false)
                      return START_STICKY
                  }

                  // Service memverifikasi klaim admin langsung ke Firebase sebelum mengaktifkan mode VIP.
                  user.getIdToken(true)
                      .addOnSuccessListener { token ->
                          if (verificationId != modeVerificationRequest) return@addOnSuccessListener
                          if (token.claims["admin"] == true) {
                              configureMode(true)
                          } else {
                              verifyRegularVip(user.uid, verificationId)
                          }
                      }
                      .addOnFailureListener {
                          if (verificationId == modeVerificationRequest) {
                              if (VipEntitlementCache.isAdmin(this, user.uid)) {
                                  configureMode(true)
                              } else {
                                  verifyRegularVip(user.uid, verificationId)
                              }
                          }
                      }
                  return START_STICKY
              }

              private fun verifyRegularVip(uid: String, verificationId: Int) {
                  FirebaseFirestore.getInstance()
                      .collection("vip_members")
                      .document(uid)
                      .get(com.google.firebase.firestore.Source.SERVER)
                      .addOnSuccessListener { member ->
                          if (verificationId != modeVerificationRequest) return@addOnSuccessListener
                          val expiresAt = member.getTimestamp("expiresAt")?.toDate()?.time ?: 0L
                          val vipActive = member.getString("membershipStatus") == "ACTIVE" &&
                              ((expiresAt == 0L && member.getString("membershipPlan") == "VIP Permanen") || expiresAt > System.currentTimeMillis())
                          if (vipActive) {
                              trialListener?.remove()
                              trialListener = null
                              trialExpiryRunnable?.let { handler.removeCallbacks(it) }
                              trialExpiryRunnable = null
                              VipEntitlementCache.save(this, uid, true, expiresAt, false)
                              configureMode(true)
                          } else {
                              VipEntitlementCache.clear(this, uid)
                              verifyTrialEntitlement(uid, verificationId)
                          }
                      }
                      .addOnFailureListener {
                          if (verificationId == modeVerificationRequest) {
                              val cached = VipEntitlementCache.isActive(this, uid)
                              configureMode(cached)
                          }
                      }
              }

              private fun currentTrialDeviceId(): String {
                  return Settings.Secure.getString(contentResolver, Settings.Secure.ANDROID_ID)
                      .orEmpty()
                      .takeIf { it.matches(Regex("^[A-Za-z0-9_-]{16,64}$")) }
                      .orEmpty()
              }

              private fun fetchTrustedServerTime(uid: String, callback: (Long) -> Unit) {
                  val clockRef = FirebaseFirestore.getInstance().collection("trial_clock").document(uid)
                  clockRef.set(mapOf("serverTime" to FieldValue.serverTimestamp()))
                      .addOnSuccessListener {
                          clockRef.get(com.google.firebase.firestore.Source.SERVER)
                              .addOnSuccessListener { clock -> callback(clock.getTimestamp("serverTime")?.toDate()?.time ?: 0L) }
                              .addOnFailureListener { callback(0L) }
                      }
                      .addOnFailureListener { callback(0L) }
              }

              private fun verifyTrialEntitlement(uid: String, verificationId: Int) {
                  FirebaseFirestore.getInstance().collection("trial_entitlements").document(uid)
                      .get(com.google.firebase.firestore.Source.SERVER)
                      .addOnSuccessListener { trial ->
                          if (verificationId != modeVerificationRequest) return@addOnSuccessListener
                          fetchTrustedServerTime(uid) { serverNow ->
                              if (verificationId != modeVerificationRequest) return@fetchTrustedServerTime
                              val deviceId = currentTrialDeviceId()
                              val storedDeviceId = trial.getString("deviceId").orEmpty()
                              val startedAt = trial.getTimestamp("startedAt")?.toDate()?.time ?: 0L
                              val expiresAt = if (startedAt > 0L) startedAt + MAsistenTrial.DURATION_MS else 0L
                              val trialActive = serverNow > 0L && trial.exists() &&
                                  deviceId.isNotBlank() && storedDeviceId == deviceId && expiresAt > serverNow
                              if (trialActive) {
                                  configureMode(true)
                                  watchTrialEntitlement(uid, expiresAt)
                              } else {
                                  trialListener?.remove()
                                  trialListener = null
                                  trialExpiryRunnable?.let { handler.removeCallbacks(it) }
                                  trialExpiryRunnable = null
                                  configureMode(false)
                              }
                          }
                      }
                      .addOnFailureListener {
                          if (verificationId == modeVerificationRequest && !vipMode) configureMode(false)
                      }
              }

              private fun watchTrialEntitlement(uid: String, expiresAt: Long) {
                  trialListener?.remove()
                  trialListener = FirebaseFirestore.getInstance().collection("trial_entitlements").document(uid)
                      .addSnapshotListener { snapshot, error ->
                          if (error == null && snapshot != null && !snapshot.metadata.isFromCache) {
                              fetchTrustedServerTime(uid) { serverNow ->
                                  val deviceId = currentTrialDeviceId()
                                  val storedDeviceId = snapshot.getString("deviceId").orEmpty()
                                  val startedAt = snapshot.getTimestamp("startedAt")?.toDate()?.time ?: 0L
                                  val latestExpiry = if (startedAt > 0L) startedAt + MAsistenTrial.DURATION_MS else 0L
                                  if (serverNow <= 0L || !snapshot.exists() || storedDeviceId != deviceId || latestExpiry <= serverNow) {
                                      verifyRegularVip(uid, modeVerificationRequest)
                                  }
                              }
                          }
                      }
                  trialExpiryRunnable?.let { handler.removeCallbacks(it) }
                  fetchTrustedServerTime(uid) { serverNow ->
                      if (serverNow <= 0L) {
                          verifyRegularVip(uid, modeVerificationRequest)
                          return@fetchTrustedServerTime
                      }
                      val expiryCheck = Runnable { verifyRegularVip(uid, modeVerificationRequest) }
                      trialExpiryRunnable = expiryCheck
                      handler.postDelayed(expiryCheck, (expiresAt - serverNow).coerceAtLeast(0L))
                  }
              }

              // Mode Standar dan VIP memakai siklus hidup terpisah.
              // Saat paket berubah, seluruh komponen mode lama dihentikan dahulu.
              private fun configureMode(enableVip: Boolean) {
                  if (serviceInitialized && vipMode == enableVip) return

                  if (serviceInitialized) {
                      stopCurrentMode()
                  }

                  vipMode = enableVip
                  serviceInitialized = true
                  registerAudioDeviceMonitoring()
                  getSharedPreferences("m_widget_mode", MODE_PRIVATE)
                      .edit().putString("active_mode", if (vipMode) MODE_VIP else MODE_STANDARD).apply()

                  // Foreground service menjaga sesi mikrofon tetap berjalan.
                  createNotification()
                  if (vipMode) acquireVipWakeLock() else releaseVipWakeLock()
                  // Mesin suara dan respons TTS tersedia pada kedua mode.
                  initializeVoiceAssistant()
                  if (vipMode) {
                      watchVipMembership()
                  } else {
                      membershipListener?.remove()
                      membershipListener = null
                      trialListener?.remove()
                      trialListener = null
                      trialExpiryRunnable?.let { handler.removeCallbacks(it) }
                      trialExpiryRunnable = null
                  }

                  createOverlay()
                  if (vipMode) {
                      scheduleVipIdleTimeout()
                      // Setelah widget berhasil diaktifkan, langsung tunggu kata pemicu.
                      // Pengguna tidak perlu mengetuk ikon mikrofon terlebih dahulu.
                      handler.postDelayed({
                          if (serviceInitialized && vipMode && !listening) {
                              awaitingWakeWord = true
                              startVoiceRecognition()
                          }
                      }, 900L)
                  }
              }

              private fun acquireVipWakeLock() {
                  try {
                      val powerManager = getSystemService(POWER_SERVICE) as android.os.PowerManager
                      val lock = vipWakeLock ?: powerManager.newWakeLock(
                          android.os.PowerManager.PARTIAL_WAKE_LOCK,
                          "MAsisten:VipVoiceStandby"
                      ).also { vipWakeLock = it }
                      if (!lock.isHeld) lock.acquire()
                  } catch (_: Exception) {
                      showMessage("Mode siaga VIP aktif, tetapi penghemat daya perangkat dapat membatasi mikrofon.")
                  }
              }

              private fun releaseVipWakeLock() {
                  try {
                      vipWakeLock?.let { if (it.isHeld) it.release() }
                  } catch (_: Exception) {}
                  vipWakeLock = null
              }

              // Widget tetap tampil setelah 5 menit tanpa perintah, tetapi sesi mikrofon dan wake lock dihentikan.
              private fun scheduleVipIdleTimeout() {
                  if (!vipMode || !serviceInitialized) return
                  vipIdleTimeoutRunnable?.let { handler.removeCallbacks(it) }
                  val timeout = Runnable {
                      if (!vipMode || !serviceInitialized) return@Runnable
                      try { speechRecognizer?.cancel() } catch (_: Exception) {}
                      try { speechRecognizer?.destroy() } catch (_: Exception) {}
                      speechRecognizer = null
                      listening = false
                      awaitingWakeWord = true
                      vipGreetingPending = false
                      textToSpeech?.stop()
                      releaseVipWakeLock()
                      showMessage("Mode siaga VIP berhenti otomatis setelah 5 menit tanpa perintah. Ketuk widget untuk mengaktifkan kembali.", speak = false)
                  }
                  vipIdleTimeoutRunnable = timeout
                  handler.postDelayed(timeout, vipIdleTimeoutMs)
              }

              private fun stopCurrentMode() {
                  unregisterAudioDeviceMonitoring()
                  vipIdleTimeoutRunnable?.let { handler.removeCallbacks(it) }
                  vipIdleTimeoutRunnable = null
                  releaseVipWakeLock()
                  membershipListener?.remove()
                  membershipListener = null
                  trialListener?.remove()
                  trialListener = null
                  trialExpiryRunnable?.let { handler.removeCallbacks(it) }
                  trialExpiryRunnable = null
                  try { speechRecognizer?.cancel() } catch (_: Exception) {}
                  try { speechRecognizer?.destroy() } catch (_: Exception) {}
                  speechRecognizer = null
                  listening = false
                  awaitingWakeWord = true
                  try { textToSpeech?.stop() } catch (_: Exception) {}
                  try { textToSpeech?.shutdown() } catch (_: Exception) {}
                  textToSpeech = null
                  textToSpeechReady = false
                  vipGreetingPending = false
                  handler.removeCallbacksAndMessages(null)

                  try {
                      if (::container.isInitialized && container.isAttachedToWindow) {
                          windowManager.removeView(container)
                      }
                  } catch (_: Exception) {}

                  if (Build.VERSION.SDK_INT >= 24) {
                      stopForeground(STOP_FOREGROUND_REMOVE)
                  } else {
                      @Suppress("DEPRECATION")
                      stopForeground(true)
                  }
              }

              private fun watchVipMembership() {
                  val user = FirebaseAuth.getInstance().currentUser
                  if (user == null) {
                      handler.post { configureMode(false) }
                      return
                  }

                  membershipListener?.remove()
                  membershipListener = null

                  // Admin tidak memerlukan dokumen VIP atau tanggal kedaluwarsa.
                  user.getIdToken(true)
                      .addOnSuccessListener { token ->
                          if (token.claims["admin"] == true) return@addOnSuccessListener
                          watchRegularVipMembership(user.uid)
                      }
                      .addOnFailureListener {
                          // Klaim admin yang pernah diverifikasi tetap berlaku dalam masa cache offline.
                          if (!VipEntitlementCache.isAdmin(this, user.uid)) {
                              watchRegularVipMembership(user.uid)
                          }
                      }
              }

              private fun watchRegularVipMembership(uid: String) {
                  membershipListener?.remove()
                  membershipListener = FirebaseFirestore.getInstance()
                      .collection("vip_members")
                      .document(uid)
                      .addSnapshotListener { snapshot, error ->
                          if (error != null || snapshot == null) {
                              // Gangguan jaringan bukan bukti bahwa VIP atau Trial telah berakhir.
                              return@addSnapshotListener
                          }

                          val expiresAt = snapshot.getTimestamp("expiresAt")?.toDate()?.time ?: 0L
                          val vipStillActive = snapshot.getString("membershipStatus") == "ACTIVE" &&
                              ((expiresAt == 0L && snapshot.getString("membershipPlan") == "VIP Permanen") || expiresAt > System.currentTimeMillis())
                          if (vipStillActive) {
                              trialListener?.remove()
                              trialListener = null
                              trialExpiryRunnable?.let { handler.removeCallbacks(it) }
                              trialExpiryRunnable = null
                              VipEntitlementCache.save(this, uid, true, expiresAt, false)
                          } else if (!snapshot.metadata.isFromCache) {
                              // VIP berakhir: periksa hak Trial 72 jam sebelum kembali ke Standar.
                              VipEntitlementCache.clear(this, uid)
                              handler.post {
                                  if (vipMode) verifyTrialEntitlement(uid, modeVerificationRequest)
                              }
                          }
                      }
              }

              private fun createNotification() {
                  MAsistenNotifications.createChannels(this)
                  val notification = Notification.Builder(this, MAsistenNotifications.SERVICE_CHANNEL)
                      .setContentTitle(if (vipMode) "M Asisten VIP aktif" else "M Asisten aktif")
                      .setContentText(if (vipMode) "Mode siaga suara VIP sedang berjalan" else "Widget mikrofon sedang berjalan")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setOngoing(true)
                      .build()

                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(
                          10,
                          notification,
                          android.content.pm.ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE
                      )
                  } else {
                      startForeground(10, notification)
                  }
              }

              private fun createOverlay() {
                  if (!Settings.canDrawOverlays(this)) {
                      stopSelf()
                      return
                  }

                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager

                  // Widget Standar tetap memakai mikrofon biru.
                  // Widget VIP memakai tulisan VIP dengan bingkai emas khusus.
                  container = FrameLayout(this).apply {
                      setPadding(0, 0, 0, 0)
                      background = null
                  }

                  micButton = TextView(this).apply {
                      text = if (vipMode) "VIP" else "🎤"
                      textSize = if (vipMode) 13f else 25f
                      typeface = if (vipMode) Typeface.create("sans-serif-black", Typeface.BOLD)
                          else Typeface.DEFAULT
                      gravity = Gravity.CENTER
                      textAlignment = View.TEXT_ALIGNMENT_CENTER
                      includeFontPadding = false
                      setTextColor(if (vipMode) 0xFFFFE6A0.toInt() else Color.WHITE)
                      if (vipMode) {
                          setShadowLayer(3.5f, 1.5f, 2.5f, 0xFF6B3900.toInt())
                      }
                      background = if (vipMode) vipWidgetBackground()
                          else roundedBackground(0xFF087F9C.toInt(), 100)
                      elevation = if (vipMode) 16f else 8f
                      setPadding(0, 0, 0, 0)
                      setOnClickListener { handleWidgetTap() }
                  }

                  container.addView(
                      micButton,
                      FrameLayout.LayoutParams(62, 62, Gravity.CENTER)
                  )

                  layoutParams = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      if (Build.VERSION.SDK_INT >= 26)
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                      else
                          WindowManager.LayoutParams.TYPE_PHONE,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 20
                      y = 250
                  }

                  try {
                      windowManager.addView(container, layoutParams)
                      enableDragging()
                  } catch (e: Exception) {
                      stopSelf()
                  }
              }

              private fun roundedBackground(color: Int, radius: Int): GradientDrawable {
                  return GradientDrawable().apply {
                      setColor(color)
                      cornerRadius = radius.toFloat()
                  }
              }

              private fun vipWidgetFrameBackground(): GradientDrawable {
                  return GradientDrawable(
                      GradientDrawable.Orientation.TL_BR,
                      intArrayOf(0xFFFFE9A6.toInt(), 0xFFB87916.toInt(), 0xFFFFD76A.toInt())
                  ).apply {
                      shape = GradientDrawable.OVAL
                      setStroke(2, 0xFFFFF4CF.toInt())
                  }
              }

              private fun vipBadgeBackground(): GradientDrawable {
                  return GradientDrawable(
                      GradientDrawable.Orientation.LEFT_RIGHT,
                      intArrayOf(0xFFFFF1B8.toInt(), 0xFFFFC94A.toInt(), 0xFFB87916.toInt())
                  ).apply {
                      cornerRadius = 22f
                      setStroke(1, 0xFFFFF8DE.toInt())
                  }
              }

              private fun vipWidgetBackground(): GradientDrawable {
                  return GradientDrawable(
                      GradientDrawable.Orientation.TL_BR,
                      intArrayOf(0xFFFFF1BC.toInt(), 0xFFD39A32.toInt(), 0xFF8A5410.toInt())
                  ).apply {
                      shape = GradientDrawable.OVAL
                      setStroke(3, 0xFFFFE8A1.toInt())
                  }
              }

              private fun enableDragging() {
              val density = resources.displayMetrics.density
              val closeSizePx = (56f * density).toInt()
              val dismissRadiusPx = 58f * density

              val closeTarget = TextView(this).apply {
              text = "✕"
              textSize = 28f
              gravity = Gravity.CENTER
              setTextColor(Color.WHITE)
              background = roundedBackground(0xFFE53935.toInt(), 100)
              elevation = 20f
              }

              val closeParams = WindowManager.LayoutParams(
              closeSizePx,
              closeSizePx,
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
              WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
              else
              WindowManager.LayoutParams.TYPE_PHONE,
              WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
              WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE,
              PixelFormat.TRANSLUCENT
              ).apply {
              gravity = Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL
              y = 36
              }

              var startX = 0
              var startY = 0
              var touchX = 0f
              var touchY = 0f
              var moved = false
              var targetVisible = false

              fun showTarget() {
              if (targetVisible) return
              try {
              windowManager.addView(closeTarget, closeParams)
              targetVisible = true
              } catch (_: Exception) {}
              }

              fun hideTarget() {
              if (!targetVisible) return
              try {
              windowManager.removeView(closeTarget)
              } catch (_: Exception) {}
              targetVisible = false
              }

              fun handleDrag(event: MotionEvent): Boolean {
              when (event.action) {
            MotionEvent.ACTION_DOWN -> {
                startX = layoutParams.x
                startY = layoutParams.y
                touchX = event.rawX
                touchY = event.rawY
                moved = false
                showTarget()
                return true
            }

            MotionEvent.ACTION_MOVE -> {
                val dx = (event.rawX - touchX).toInt()
                val dy = (event.rawY - touchY).toInt()

                if (kotlin.math.abs(dx) > 8 ||
                    kotlin.math.abs(dy) > 8
                ) {
                    moved = true
                }

                if (moved) {
                    layoutParams.x = (startX + dx).coerceAtLeast(0)
                    layoutParams.y = (startY + dy).coerceAtLeast(0)

                    try {
                        windowManager.updateViewLayout(
                            container,
                            layoutParams
                        )
                    } catch (_: Exception) {}
                }
                return true
            }

            MotionEvent.ACTION_UP -> {
                val metrics = resources.displayMetrics
                val widgetX = layoutParams.x + container.width / 2
                val widgetY = layoutParams.y + container.height / 2
                val targetX = metrics.widthPixels / 2
                val targetY = metrics.heightPixels - closeParams.y - closeSizePx / 2
                val distanceToCloseTarget = kotlin.math.hypot(
                    (widgetX - targetX).toDouble(),
                    (widgetY - targetY).toDouble()
                )

                // Area hapus berbentuk lingkaran, lebih luas daripada tombol X.
                // Widget tidak perlu tepat berada di tengah tanda X.
                val dismiss = moved && distanceToCloseTarget <= dismissRadiusPx

                hideTarget()

                if (dismiss) {
                    stopSelf()
                } else if (!moved) {
                    handleWidgetTap()
                }
                return true
            }

            MotionEvent.ACTION_CANCEL -> {
                hideTarget()
                return true
            }
            }
            return true
            }

            container.setOnTouchListener { _, event ->
            handleDrag(event)
            }

            micButton.setOnTouchListener { _, event ->
            handleDrag(event)
            }
            }

              private fun initializeVoiceAssistant() {
                  textToSpeech = TextToSpeech(this) { status ->
                      if (status == TextToSpeech.SUCCESS) {
                          textToSpeech?.let { engine ->
                              // Ikuti bahasa utama perangkat; gunakan English (US) bila bahasa itu tidak didukung.
                              val preferredLocale = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                                  resources.configuration.locales[0] ?: Locale.getDefault()
                              } else {
                                  @Suppress("DEPRECATION")
                                  resources.configuration.locale ?: Locale.getDefault()
                              }
                              val preferredResult = engine.setLanguage(preferredLocale)
                              textToSpeechReady = preferredResult >= TextToSpeech.LANG_AVAILABLE
                              if (!textToSpeechReady) {
                                  val fallbackResult = engine.setLanguage(Locale.US)
                                  textToSpeechReady = fallbackResult >= TextToSpeech.LANG_AVAILABLE
                              }
                              MAsistenVoiceSettings.applyTo(this@FloatingVoiceService, engine)
                              pendingSpeechResponse?.let { pending ->
                                  pendingSpeechResponse = null
                                  if (textToSpeechReady) handler.post { speakResponse(pending) }
                              }
                              if (vipGreetingPending && vipMode) {
                                  handler.post {
                                      if (vipGreetingPending && vipMode) {
                                          vipGreetingPending = false
                                          if (textToSpeechReady) {
                                              speakTextThenListen("Hello M, please say a command.")
                                          } else {
                                              showMessage("Text-to-speech is unavailable. Please install a voice for your device language in Android settings.")
                                              startVoiceRecognition()
                                          }
                                      }
                                  }
                              }
                          }
                      } else if (vipGreetingPending && vipMode) {
                          handler.post {
                              vipGreetingPending = false
                              showMessage("Text-to-speech is unavailable. Please say a command.")
                              startVoiceRecognition()
                          }
                      }
                  }
              }

              private fun handleWidgetTap() {
                  if (vipMode) {
                      // Ketukan mengaktifkan kembali standby VIP dan mengulang hitung 5 menit.
                      acquireVipWakeLock()
                      scheduleVipIdleTimeout()
                      // Pulihkan recognizer, termasuk setelah standby otomatis berhenti.
                      try { speechRecognizer?.cancel() } catch (_: Exception) {}
                      try { speechRecognizer?.destroy() } catch (_: Exception) {}
                      speechRecognizer = null
                      listening = false
                      awaitingWakeWord = true
                      textToSpeech?.stop()
                      handler.postDelayed({
                          if (vipMode && serviceInitialized && !listening) {
                              startVoiceRecognition()
                          }
                      }, 250L)
                  } else {
                      // Standar: langsung dengarkan satu perintah tanpa sapaan suara.
                      beginManualListening()
                  }
              }

              private fun beginManualListening() {
                  if (listening && awaitingWakeWord) {
                      try {
                          speechRecognizer?.cancel()
                      } catch (_: Exception) {}
                      listening = false
                  }
                  awaitingWakeWord = false
                  textToSpeech?.stop()
                  startVoiceRecognition()
              }

              private fun speakAndListen() {
                  if (listening) return
                  awaitingWakeWord = false
                  if (!textToSpeechReady || textToSpeech == null) {
                      vipGreetingPending = true
                      showMessage("Menyiapkan sapaan suara...")
                      return
                  }
                  vipGreetingPending = false
                  // Kata pemicu "Hallo M" berasal dari pengguna, bukan suara sapaan aplikasi.
                  speakTextThenListen("Silahkan ucapkan perintah.")
              }

              private fun speakTextThenListen(message: String) {
                  val engine = textToSpeech
                  if (textToSpeechReady && engine != null) {
                      try {
                          showMessage(message, speak = false)
                          val utteranceId = "m_voice_prompt_" + System.currentTimeMillis()
                          engine.setOnUtteranceProgressListener(
                              object : android.speech.tts.UtteranceProgressListener() {
                                  override fun onStart(id: String?) {}
                                  override fun onDone(id: String?) {
                                      if (id == utteranceId) handler.post { startVoiceRecognition() }
                                  }
                                  @Deprecated("Deprecated in Java")
                                  override fun onError(id: String?) {
                                      if (id == utteranceId) handler.post { startVoiceRecognition() }
                                  }
                              }
                          )
                          val result = engine.speak(
                              message,
                              TextToSpeech.QUEUE_FLUSH,
                              null,
                              utteranceId
                          )
                          if (result == TextToSpeech.ERROR) startVoiceRecognition()
                      } catch (_: Exception) {
                          startVoiceRecognition()
                      }
                  } else {
                      showMessage(message)
                      startVoiceRecognition()
                  }
              }

              private fun speakWakeWordResponse() {
                  awaitingWakeWord = false
                  speakTextThenListen("Silahkan ucapkan perintah.")
              }

              private fun isWakeWord(text: String): Boolean {
                  val normalized = MAsistenVoiceSettings.normalize(text)
                  val configuredPhrase = MAsistenVoiceSettings.normalize(
                      MAsistenVoiceSettings.DEFAULT_WAKE_PHRASE
                  )
                  if (normalized == configuredPhrase) return true
                  // Variasi pengucapan untuk kata pemicu tetap "Hallo M".
                  return normalized in setOf("halo m", "hello m", "hallo em", "halo em", "hello em")
              }

              private fun scheduleWakeWordListening(delayMs: Long = 800L) {
                  handler.postDelayed({
                      if (!listening) {
                          awaitingWakeWord = true
                          startVoiceRecognition()
                      }
                  }, delayMs)
              }

              private fun startVoiceRecognition() {
                  if (listening || !serviceInitialized) return
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      showMessage("Izin mikrofon diperlukan agar mode siaga VIP dapat berjalan.")
                      return
                  }

                  // Jangan pernah jatuh kembali ke layanan pengenalan suara cloud.
                  // API on-device tersedia mulai Android 12 (API 31).
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.S) {
                      showMessage("Pengenalan suara offline memerlukan Android 12 atau lebih baru pada versi aplikasi ini.")
                      return
                  }

                  if (!SpeechRecognizer.isOnDeviceRecognitionAvailable(this)) {
                      showMessage("Pengenalan suara offline tidak tersedia. Periksa dukungan layanan suara offline dan paket Bahasa Indonesia di perangkat.")
                      return
                  }

                  try {
                      speechRecognizer?.destroy()
                      speechRecognizer = SpeechRecognizer.createOnDeviceSpeechRecognizer(this)

                      speechRecognizer?.setRecognitionListener(
                          object : RecognitionListener {
                              override fun onReadyForSpeech(params: android.os.Bundle?) {
                                  // Status layar tidak dibacakan agar instruksi suara tidak berulang.
                                  showMessage(
                                      if (awaitingWakeWord) "Menunggu panggilan Hallo M..."
                                      else "Mendengarkan perintah...",
                                      speak = false
                                  )
                              }

                              override fun onBeginningOfSpeech() {
                                  showMessage("Mendengarkan...")
                              }

                              override fun onRmsChanged(rmsdB: Float) {}
                              override fun onBufferReceived(buffer: ByteArray?) {}
                              override fun onEndOfSpeech() {
                                  showMessage("Memproses suara...")
                              }

                              override fun onError(error: Int) {
                                  listening = false
                                  val wasWaitingForWakeWord = awaitingWakeWord
                                  val retryWakeWord = wasWaitingForWakeWord && (
                                      error == SpeechRecognizer.ERROR_NO_MATCH ||
                                      error == SpeechRecognizer.ERROR_SPEECH_TIMEOUT ||
                                      error == SpeechRecognizer.ERROR_NETWORK ||
                                      error == SpeechRecognizer.ERROR_NETWORK_TIMEOUT
                                  )
                                  if (vipMode && error != SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS) {
                                      // SpeechRecognizer menutup sesi setelah timeout atau hasil tertentu.
                                      // VIP selalu membuat sesi baru agar kata pemicu tetap dipantau.
                                      awaitingWakeWord = true
                                      showMessage("Menunggu panggilan Hallo M...", speak = false)
                                      val retryDelay = when {
                                          retryWakeWord -> 900L
                                          error == SpeechRecognizer.ERROR_AUDIO -> 1800L
                                          error == SpeechRecognizer.ERROR_NETWORK ||
                                              error == SpeechRecognizer.ERROR_NETWORK_TIMEOUT -> 30_000L
                                          else -> 3_000L
                                      }
                                      resumeVipWakeWordListening(retryDelay)
                                      return
                                  }
                                  awaitingWakeWord = false
                                  val detail = when (error) {
                                      SpeechRecognizer.ERROR_AUDIO -> "Masalah pada input mikrofon"
                                      SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS -> "Izin mikrofon belum diberikan"
                                      SpeechRecognizer.ERROR_NETWORK,
                                      SpeechRecognizer.ERROR_NETWORK_TIMEOUT -> "Pengenalan suara offline gagal. Pastikan paket Bahasa Indonesia offline tersedia di perangkat."
                                      SpeechRecognizer.ERROR_NO_MATCH,
                                      SpeechRecognizer.ERROR_SPEECH_TIMEOUT -> "Suara tidak dikenali. Ketuk widget untuk mencoba lagi."
                                      else -> "Pengenalan suara gagal (kode $error). Ketuk widget untuk mencoba lagi."
                                  }
                                  showMessage(detail)
                              }

                              override fun onResults(results: android.os.Bundle?) {
                                  listening = false
                                  val wasAwaitingWakeWord = awaitingWakeWord
                                  val words = results?.getStringArrayList(
                                      SpeechRecognizer.RESULTS_RECOGNITION
                                  )?.firstOrNull()

                                  if (wasAwaitingWakeWord) {
                                      if (!words.isNullOrBlank() && isWakeWord(words)) {
                                          awaitingWakeWord = false
                                          showMessage("Hallo M terdeteksi. Mode perintah suara aktif.", speak = false)
                                          speakWakeWordResponse()
                                      } else {
                                          awaitingWakeWord = true
                                          showMessage("Menunggu panggilan Hallo M...", speak = false)
                                          scheduleWakeWordListening(600L)
                                      }
                                      return
                                  }

                                  awaitingWakeWord = false
                                  if (!words.isNullOrBlank()) {
                                      if (vipMode) scheduleVipIdleTimeout()
                                      showMessage("Perintah: $words", speak = false)
                                      executeCommand(words)
                                  } else {
                                      showMessage("Perintah tidak dikenali. Menunggu panggilan Hallo M...", speak = false)
                                  }
                                  // Setelah satu perintah VIP selesai, selalu kembali ke mode wake-word,
                                  // termasuk saat aplikasi tujuan dibuka ketika perangkat sedang offline.
                                  if (vipMode) resumeVipWakeWordListening(2200L)
                              }

                              override fun onPartialResults(partialResults: android.os.Bundle?) {
                                  val words = partialResults?.getStringArrayList(
                                      SpeechRecognizer.RESULTS_RECOGNITION
                                  )?.firstOrNull()
                                  if (!words.isNullOrBlank() && !awaitingWakeWord) {
                                      showMessage(words, speak = false)
                                  }
                              }

                              override fun onEvent(eventType: Int, params: android.os.Bundle?) {}
                          }
                      )

                      val deviceLocale = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N) {
                          resources.configuration.locales[0] ?: Locale.getDefault()
                      } else {
                          @Suppress("DEPRECATION")
                          resources.configuration.locale ?: Locale.getDefault()
                      }
                      val deviceLanguageTag = deviceLocale.toLanguageTag().takeIf { it.isNotBlank() } ?: "en-US"
                      val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                          putExtra(
                              RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                              RecognizerIntent.LANGUAGE_MODEL_FREE_FORM
                          )
                          // Pengenalan suara mengikuti bahasa utama perangkat.
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE, deviceLanguageTag)
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE_PREFERENCE, deviceLanguageTag)
                          putExtra(RecognizerIntent.EXTRA_PREFER_OFFLINE, true)
                          putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 1)
                          putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                      }

                      val recognizer = speechRecognizer
                          ?: throw IllegalStateException("Mesin suara offline tidak tersedia")

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                          // Pilih bahasa perangkat jika tersedia; jika tidak, gunakan English (US).
                          listening = true
                          val callbackExecutor = java.util.concurrent.Executor { task ->
                              handler.post(task)
                          }
                          recognizer.checkRecognitionSupport(
                              intent,
                              callbackExecutor,
                              object : android.speech.RecognitionSupportCallback {
                                  override fun onSupportResult(
                                      support: android.speech.RecognitionSupport
                                  ) {
                                      if (speechRecognizer !== recognizer) return
                                      fun hasLanguage(languages: List<String>, language: String): Boolean =
                                          languages.any {
                                              Locale.forLanguageTag(it).language.equals(language, ignoreCase = true)
                                          }

                                      val preferredLanguage = deviceLocale.language.ifBlank { "en" }
                                      val targetLanguage = when {
                                          hasLanguage(support.installedOnDeviceLanguages, preferredLanguage) ||
                                              hasLanguage(support.pendingOnDeviceLanguages, preferredLanguage) ||
                                              hasLanguage(support.supportedOnDeviceLanguages, preferredLanguage) -> deviceLanguageTag
                                          hasLanguage(support.installedOnDeviceLanguages, "en") ||
                                              hasLanguage(support.pendingOnDeviceLanguages, "en") ||
                                              hasLanguage(support.supportedOnDeviceLanguages, "en") -> "en-US"
                                          else -> null
                                      }

                                      if (targetLanguage == null) {
                                          listening = false
                                          showMessage(
                                              "Paket suara offline untuk bahasa perangkat dan Bahasa Inggris belum tersedia. VIP akan memeriksa kembali otomatis.",
                                              speak = false
                                          )
                                          if (vipMode) resumeVipWakeWordListening(60_000L)
                                          return
                                      }

                                      intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, targetLanguage)
                                      intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_PREFERENCE, targetLanguage)
                                      when {
                                          hasLanguage(support.installedOnDeviceLanguages, Locale.forLanguageTag(targetLanguage).language) -> {
                                              try {
                                                  recognizer.startListening(intent)
                                                  listening = true
                                              } catch (_: Exception) {
                                                  listening = false
                                                  showMessage("Could not start offline speech recognition.")
                                              }
                                          }
                                          hasLanguage(support.pendingOnDeviceLanguages, Locale.forLanguageTag(targetLanguage).language) -> {
                                              listening = false
                                              showMessage(
                                                  "Paket bahasa offline sedang disiapkan Android. VIP akan mencoba kembali otomatis.",
                                                  speak = false
                                              )
                                              if (vipMode) resumeVipWakeWordListening(30_000L)
                                          }
                                          else -> {
                                              listening = false
                                              showMessage(
                                                  "Paket bahasa offline belum terpasang. Hubungkan internet untuk mengunduhnya; VIP akan memeriksa kembali otomatis.",
                                                  speak = false
                                              )
                                              try {
                                                  recognizer.triggerModelDownload(intent)
                                              } catch (_: Exception) {
                                                  showMessage(
                                                      "Unduhan paket suara gagal dimulai. Periksa pengaturan suara Android.",
                                                      speak = false
                                                  )
                                              }
                                              if (vipMode) resumeVipWakeWordListening(60_000L)
                                          }
                                      }
                                  }

                                  override fun onError(error: Int) {
                                      if (speechRecognizer !== recognizer) return
                                      if (error == SpeechRecognizer.ERROR_CANNOT_CHECK_SUPPORT) {
                                          try {
                                              recognizer.startListening(intent)
                                              listening = true
                                          } catch (_: Exception) {
                                              listening = false
                                              showMessage("Could not start offline speech recognition.")
                                          }
                                      } else {
                                          listening = false
                                          showMessage("Could not check offline speech-language support (code $error).")
                                      }
                                  }
                              }
                          )
                      } else {
                          // Android 6–12: gunakan bahasa perangkat yang dipilih pada intent.
                          listening = true
                          recognizer.startListening(intent)
                      }
                  } catch (_: Exception) {
                      listening = false
                      showMessage("Mikrofon atau mesin pengenalan suara offline tidak dapat diaktifkan.")
                      if (awaitingWakeWord) scheduleWakeWordListening(1800L)
                  }
              }

