
name: Build M Launcher Voice

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  security-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate VIP admin tool
        run: node --check admin-tools/vip-admin.js

      - name: Audit admin dependencies
        run: |
          npm ci --prefix admin-tools
          npm audit --prefix admin-tools --audit-level=high

      - name: Setup Node.js for Firestore rules tests
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Test Firestore Security Rules
        run: |
          npm install --prefix security-tests --no-audit --no-fund
          # Tooling is ephemeral CI-only; production/admin dependencies are audited separately.
          security-tests/node_modules/.bin/firebase emulators:exec --only firestore --project demo-m-launcher-voice "node security-tests/firestore-rules.test.mjs"

  build:
    needs: security-checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Enable AndroidX
        run: |
          printf "android.useAndroidX=true\\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\\norg.gradle.workers.max=2\\n" > gradle.properties

      - name: Create Android Project
        run: |
          mkdir -p app/src/main/java/com/m/launchervoice

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "M-Launcher-Voice"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
              id("com.google.gms.google-services") version "4.4.2" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          if (file("google-services.json").exists()) {
              apply(plugin = "com.google.gms.google-services")
          }

          android {
              namespace = "com.m.launchervoice"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.m.launchervoice"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 35
                  versionName = "2.42"
              }

              signingConfigs {
                  create("release") {
                      storeFile = file(System.getenv("SIGNING_STORE_FILE"))
                      storePassword = System.getenv("SIGNING_STORE_PASSWORD")
                      keyAlias = System.getenv("SIGNING_KEY_ALIAS")
                      keyPassword = System.getenv("SIGNING_KEY_PASSWORD")
                  }
              }

              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.activity:activity-compose:1.10.0")
              implementation("androidx.fragment:fragment-ktx:1.8.5")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")

              implementation(platform("com.google.firebase:firebase-bom:33.7.0"))
              implementation("com.google.android.gms:play-services-auth:21.3.0")
              implementation("com.google.firebase:firebase-auth")
              implementation("com.google.firebase:firebase-firestore")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.WRITE_SETTINGS"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="com.android.alarm.permission.SET_ALARM"/>

              <uses-feature
                  android:name="android.hardware.camera.flash"
                  android:required="false"/>

              <queries>
                  <!-- Aplikasi yang ditampilkan di daftar launcher -->
                  <intent>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.LAUNCHER"/>
                  </intent>
                  <!-- Aplikasi bawaan yang dibuka melalui intent Android -->
                  <intent>
                      <action android:name="android.intent.action.DIAL"/>
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.SENDTO"/>
                      <data android:scheme="smsto"/>
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.APP_MESSAGING"/>
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.APP_CONTACTS"/>
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.APP_CALENDAR"/>
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.MAIN"/>
                      <category android:name="android.intent.category.APP_BROWSER"/>
                  </intent>
                  <intent>
                      <action android:name="android.media.action.STILL_IMAGE_CAMERA"/>
                  </intent>
                  <intent>
                      <action android:name="android.media.action.IMAGE_CAPTURE"/>
                  </intent>
                  <intent>
                      <action android:name="android.media.action.VIDEO_CAPTURE"/>
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW"/>
                      <data android:scheme="geo"/>
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.VIEW"/>
                      <data android:mimeType="image/*"/>
                  </intent>
              </queries>

              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="M Asisten"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:allowBackup="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.HOME"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".FloatingVoiceService"
                      android:exported="false"
                      android:foregroundServiceType="microphone"/>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/m/launchervoice/MainActivity.kt <<'EOF'
          package com.m.launchervoice

          import android.Manifest
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.content.Intent
          import android.net.Uri
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import com.google.android.gms.auth.api.signin.GoogleSignIn
          import com.google.android.gms.auth.api.signin.GoogleSignInOptions
          import com.google.android.gms.common.api.ApiException
          import com.google.firebase.auth.FirebaseAuth
          import com.google.firebase.auth.GoogleAuthProvider
          import com.google.firebase.firestore.FieldValue
          import com.google.firebase.firestore.FirebaseFirestore
          import androidx.compose.foundation.Image
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.res.painterResource
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.asImageBitmap
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.compose.ui.window.DialogProperties

          private val Navy = Color(0xFF07111F)
          private val Panel = Color(0xFF111F32)
          private val Cyan = Color(0xFF35D6E8)
          private val Blue = Color(0xFF397BFF)
          private val Muted = Color(0xFF9DB2C9)

          // Hak VIP+ yang sudah diverifikasi disimpan agar tetap tersedia tanpa internet.
          // Cache terikat ke UID dan tidak boleh melewati masa berlaku membership.
          object VipEntitlementCache {
              private const val PREFS = "vip_entitlement_cache"
              private const val KEY_UID = "uid"
              private const val KEY_ACTIVE = "active"
              private const val KEY_ADMIN = "admin"
              private const val KEY_EXPIRES_AT = "expires_at"
              private const val KEY_VERIFIED_AT = "verified_at"
              private const val OFFLINE_GRACE_MS = 30L * 24L * 60L * 60L * 1000L

              fun save(
                  context: android.content.Context,
                  uid: String,
                  active: Boolean,
                  expiresAt: Long = 0L,
                  admin: Boolean = false
              ) {
                  context.getSharedPreferences(PREFS, android.content.Context.MODE_PRIVATE)
                      .edit()
                      .putString(KEY_UID, uid)
                      .putBoolean(KEY_ACTIVE, active)
                      .putBoolean(KEY_ADMIN, admin)
                      .putLong(KEY_EXPIRES_AT, expiresAt)
                      .putLong(KEY_VERIFIED_AT, System.currentTimeMillis())
                      .apply()
              }

              fun clear(context: android.content.Context, uid: String? = null) {
                  val prefs = context.getSharedPreferences(PREFS, android.content.Context.MODE_PRIVATE)
                  if (uid == null || prefs.getString(KEY_UID, null) == uid) {
                      prefs.edit().clear().apply()
                  }
              }

              fun isActive(context: android.content.Context, uid: String): Boolean {
                  val prefs = context.getSharedPreferences(PREFS, android.content.Context.MODE_PRIVATE)
                  if (prefs.getString(KEY_UID, null) != uid || !prefs.getBoolean(KEY_ACTIVE, false)) {
                      return false
                  }
                  val now = System.currentTimeMillis()
                  val verifiedAt = prefs.getLong(KEY_VERIFIED_AT, 0L)
                  val expiresAt = prefs.getLong(KEY_EXPIRES_AT, 0L)
                  val cacheLimit = if (expiresAt > 0L) expiresAt else verifiedAt + OFFLINE_GRACE_MS
                  return verifiedAt > 0L && now < cacheLimit && now - verifiedAt <= OFFLINE_GRACE_MS
              }

              fun isAdmin(context: android.content.Context, uid: String): Boolean {
                  val prefs = context.getSharedPreferences(PREFS, android.content.Context.MODE_PRIVATE)
                  return prefs.getString(KEY_UID, null) == uid &&
                      prefs.getBoolean(KEY_ADMIN, false) && isActive(context, uid)
              }

              fun expiry(context: android.content.Context, uid: String): Long {
                  val prefs = context.getSharedPreferences(PREFS, android.content.Context.MODE_PRIVATE)
                  return if (prefs.getString(KEY_UID, null) == uid) prefs.getLong(KEY_EXPIRES_AT, 0L) else 0L
              }
          }

          class MainActivity : ComponentActivity() {

              private var message by mutableStateOf("Widget mikrofon siap diaktifkan")
              private var googleAccountName by mutableStateOf("")
              private var googleAccountEmail by mutableStateOf("")
              private var vipMembershipStatus by mutableStateOf("BELUM AKTIF")
              private var isAdminAccount by mutableStateOf(false)

              private val voiceMessageReceiver = object : android.content.BroadcastReceiver() {
                  override fun onReceive(context: android.content.Context?, intent: Intent?) {
                      message = intent?.getStringExtra("message").orEmpty().ifBlank { message }
                  }
              }

              private val googleSignInLauncher = registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { result ->
                  if (result.resultCode == RESULT_OK) {
                      try {
                          val account = GoogleSignIn.getSignedInAccountFromIntent(result.data).getResult(ApiException::class.java)
                          val token = account.idToken
                          if (token.isNullOrBlank()) {
                              message = "Token Google tidak tersedia. Periksa konfigurasi OAuth Firebase."
                          } else {
                              FirebaseAuth.getInstance().signInWithCredential(GoogleAuthProvider.getCredential(token, null))
                                  .addOnSuccessListener { authResult ->
                                      val user = authResult.user
                                      if (user == null) {
                                          message = "Login Google gagal membaca akun."
                                      } else {
                                          refreshAdminClaim(user)
                                          googleAccountName = user.displayName ?: account.displayName ?: "Pengguna M Asisten"
                                          googleAccountEmail = user.email ?: account.email.orEmpty()
                                          val memberRef = FirebaseFirestore.getInstance().collection("vip_members").document(user.uid)
                                          memberRef.get()
                                              .addOnSuccessListener { existing ->
                                                  val profileData = hashMapOf<String, Any>(
                                                      "uid" to user.uid, "email" to googleAccountEmail,
                                                      "displayName" to googleAccountName, "provider" to "google",
                                                      "lastLoginAt" to FieldValue.serverTimestamp(),
                                                      "updatedAt" to FieldValue.serverTimestamp()
                                                  )
                                                  if (existing.exists()) {
                                                      memberRef.update(profileData as Map<String, Any>)
                                                          .addOnSuccessListener {
                                                              message = "Akun Google berhasil terhubung."
                                                              loadVipMembership(user.uid)
                                                          }
                                                          .addOnFailureListener { err -> message = "Pembaruan akun gagal: " + err.localizedMessage }
                                                  } else {
                                                      // Status keanggotaan hanya boleh ditetapkan oleh server.
                                                      // Dokumen awal hanya berisi profil Google yang diizinkan Firestore Rules.
                                                      memberRef.set(profileData)
                                                          .addOnSuccessListener {
                                                              message = "Akun Google berhasil terhubung."
                                                              loadVipMembership(user.uid)
                                                          }
                                                          .addOnFailureListener { err -> message = "Pembuatan profil VIP gagal: " + err.localizedMessage }
                                                  }
                                              }
                                              .addOnFailureListener { err -> message = "Sinkronisasi VIP gagal: " + err.localizedMessage }
                                      }
                                  }
                                  .addOnFailureListener { err -> message = "Login Firebase gagal: " + err.localizedMessage }
                          }
                      } catch (err: ApiException) {
                          message = "Login Google gagal (kode " + err.statusCode + ")."
                      } catch (err: Exception) {
                          message = "Gagal memproses akun Google: " + err.localizedMessage
                      }
                  } else {
                      message = "Login Google dibatalkan."
                  }
              }

              private fun startGoogleSignIn() {
                  val id = resources.getIdentifier("default_web_client_id", "string", packageName)
                  if (id == 0) {
                      message = "OAuth Google belum dikonfigurasi di Firebase."
                      return
                  }
                  val options = GoogleSignInOptions.Builder(GoogleSignInOptions.DEFAULT_SIGN_IN)
                      .requestEmail().requestIdToken(getString(id)).build()
                  googleSignInLauncher.launch(GoogleSignIn.getClient(this, options).signInIntent)
              }

              private fun refreshAdminClaim(user: com.google.firebase.auth.FirebaseUser) {
                  user.getIdToken(true)
                      .addOnSuccessListener { token ->
                          isAdminAccount = token.claims["admin"] == true
                          if (isAdminAccount) {
                              VipEntitlementCache.save(this, user.uid, true, 0L, true)
                              vipMembershipStatus = "VIP+ AKTIF • ADMIN"
                          }
                      }
                      .addOnFailureListener { isAdminAccount = false }
              }

              private fun loadVipMembership(uid: String) {
                  val user = FirebaseAuth.getInstance().currentUser
                  if (user == null || user.uid != uid) {
                      vipMembershipStatus = "BELUM AKTIF"
                      isAdminAccount = false
                      return
                  }

                  user.getIdToken(true)
                      .addOnSuccessListener { token ->
                          val admin = token.claims["admin"] == true
                          isAdminAccount = admin
                          if (admin) {
                              // Hak VIP+ admin berasal dari Custom Claims, tidak dari dokumen pembayaran.
                              VipEntitlementCache.save(this, uid, true, 0L, true)
                              vipMembershipStatus = "VIP+ AKTIF • ADMIN"
                          } else {
                              loadRegularVipMembership(uid)
                          }
                      }
                      .addOnFailureListener {
                          isAdminAccount = false
                          loadRegularVipMembership(uid)
                      }
              }

              private fun loadRegularVipMembership(uid: String) {
                  FirebaseFirestore.getInstance().collection("vip_members").document(uid)
                      .get(com.google.firebase.firestore.Source.SERVER)
                      .addOnSuccessListener { snap ->
                          val status = snap.getString("membershipStatus") ?: "FREE"
                          val expiresAt = snap.getTimestamp("expiresAt")?.toDate()?.time ?: 0L
                          val active = status == "ACTIVE" &&
                              (expiresAt == 0L || expiresAt > System.currentTimeMillis())
                          VipEntitlementCache.save(this, uid, active, expiresAt, false)
                          vipMembershipStatus = if (active) "VIP+ AKTIF" else "BELUM AKTIF"
                      }
                      .addOnFailureListener {
                          val cached = VipEntitlementCache.isActive(this, uid)
                          vipMembershipStatus = if (cached) "VIP+ AKTIF • OFFLINE" else "STATUS BELUM TERSINKRON"
                      }
              }

              private val permissionLauncher =
                  registerForActivityResult(
                      ActivityResultContracts.RequestMultiplePermissions()
                  ) { grants ->
                      if (grants[Manifest.permission.RECORD_AUDIO] == false ||
                          checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED
                      ) {
                          message = "Izin mikrofon diperlukan untuk menjalankan widget Standar maupun VIP."
                      } else {
                          continueSetup()
                      }
                  }

              private val overlayLauncher =
                  registerForActivityResult(
                      ActivityResultContracts.StartActivityForResult()
                  ) {
                      if (Settings.canDrawOverlays(this)) {
                          startFloatingService()
                      } else {
                          message = "Izin tampil di atas aplikasi belum diberikan"
                      }
                  }

              override fun onStart() {
                  super.onStart()
                  val filter = android.content.IntentFilter("com.m.launchervoice.VOICE_MESSAGE")
                  if (Build.VERSION.SDK_INT >= 33) {
                      registerReceiver(
                          voiceMessageReceiver,
                          filter,
                          android.content.Context.RECEIVER_NOT_EXPORTED
                      )
                  } else {
                      @Suppress("DEPRECATION")
                      registerReceiver(voiceMessageReceiver, filter)
                  }
                  message = getSharedPreferences("m_voice_status", MODE_PRIVATE)
                      .getString("latest_message", message) ?: message
              }

              override fun onStop() {
                  try {
                      unregisterReceiver(voiceMessageReceiver)
                  } catch (_: Exception) {}
                  super.onStop()
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  FirebaseAuth.getInstance().currentUser?.let { user ->
                      googleAccountName = user.displayName ?: "Pengguna M Asisten"
                      googleAccountEmail = user.email.orEmpty()
                      refreshAdminClaim(user)
                      loadVipMembership(user.uid)
                  }

                  setContent {
                      MaterialTheme(
                          colorScheme = darkColorScheme(
                              primary = Cyan,
                              background = Navy,
                              surface = Panel,
                              onPrimary = Navy,
                              onBackground = Color.White,
                              onSurface = Color.White
                          )
                      ) {
                          MLauncherHome(
                              message = message,
                              onActivate = { beginSetup() },
                              googleAccountName = googleAccountName,
                              googleAccountEmail = googleAccountEmail,
                              vipMembershipStatus = vipMembershipStatus,
                              isAdminAccount = isAdminAccount,
                              onGoogleSignIn = { startGoogleSignIn() },
                              onLogout = { signOutAccount() }
                          )
                      }
                  }
              }

              private fun signOutAccount() {
                  // Keluar dari Firebase dan sesi Google agar pengguna bisa memilih akun kedua.
                  FirebaseAuth.getInstance().signOut()
                  val webClientId = resources.getIdentifier("default_web_client_id", "string", packageName)
                  val optionsBuilder = GoogleSignInOptions.Builder(GoogleSignInOptions.DEFAULT_SIGN_IN).requestEmail()
                  if (webClientId != 0) optionsBuilder.requestIdToken(getString(webClientId))
                  GoogleSignIn.getClient(this, optionsBuilder.build()).signOut()
                  googleAccountName = ""
                  googleAccountEmail = ""
                  vipMembershipStatus = "BELUM AKTIF"
                  isAdminAccount = false
                  message = "Akun berhasil keluar. Silakan masuk dengan akun lain."
              }

              private fun beginSetup() {
                  // Kedua paket memakai mikrofon setelah widget diketuk.
                  val permissions = mutableListOf(Manifest.permission.RECORD_AUDIO)

                  if (Build.VERSION.SDK_INT >= 33) {
                      permissions.add(Manifest.permission.POST_NOTIFICATIONS)
                  }

                  val missing = permissions.filter {
                      checkSelfPermission(it) != PackageManager.PERMISSION_GRANTED
                  }

                  if (missing.isNotEmpty()) {
                      permissionLauncher.launch(missing.toTypedArray())
                  } else {
                      continueSetup()
                  }
              }

              private fun continueSetup() {
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      message = "Izinkan akses mikrofon untuk mengaktifkan widget."
                      return
                  }
                  if (!Settings.canDrawOverlays(this)) {
                      message = "Izinkan M Asisten tampil di atas aplikasi lain"
                      val intent = Intent(
                          Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                          Uri.parse("package:$packageName")
                      )
                      overlayLauncher.launch(intent)
                  } else {
                      startFloatingService()
                  }
              }

              private fun startFloatingService() {
                  val user = FirebaseAuth.getInstance().currentUser
                  if (user == null) {
                      try {
                          val intent = Intent(this, FloatingVoiceService::class.java)
                              .putExtra(FloatingVoiceService.EXTRA_MODE, FloatingVoiceService.MODE_STANDARD)
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(intent)
                          else startService(intent)
                          message = "Widget Standar aktif. Ketuk lalu ucapkan perintah untuk aplikasi bawaan."
                      } catch (e: Exception) {
                          message = "Tidak dapat mengaktifkan widget: ${e.message}"
                      }
                      return
                  }
                  val userUid = user.uid

                  fun launchWidget(mode: String) {
                      try {
                          val intent = Intent(this, FloatingVoiceService::class.java)
                              .putExtra(FloatingVoiceService.EXTRA_MODE, mode)
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              startForegroundService(intent)
                          } else {
                              startService(intent)
                          }
                          message = if (mode == FloatingVoiceService.MODE_VIP) {
                              "Widget VIP aktif. M Asisten siap menunggu panggilan Hallo M."
                          } else {
                              "Widget Standar aktif. Ketuk lalu ucapkan perintah untuk aplikasi bawaan."
                          }
                      } catch (e: Exception) {
                          message = "Tidak dapat mengaktifkan widget: ${e.message}"
                      }
                  }

                  fun activateVerifiedVip(isVip: Boolean, expiresAt: Long = 0L, admin: Boolean = false) {
                      if (isVip) {
                          VipEntitlementCache.save(this, userUid, true, expiresAt, admin)
                      } else {
                          VipEntitlementCache.clear(this, userUid)
                      }
                      if (isVip &&
                          checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED
                      ) {
                          message = "VIP aktif. Izinkan mikrofon untuk memakai asisten suara."
                          permissionLauncher.launch(arrayOf(Manifest.permission.RECORD_AUDIO))
                          return
                      }
                      launchWidget(if (isVip) FloatingVoiceService.MODE_VIP else FloatingVoiceService.MODE_STANDARD)
                  }

                  fun useOfflineEntitlement() {
                      val cached = VipEntitlementCache.isActive(this, userUid)
                      activateVerifiedVip(
                          cached,
                          VipEntitlementCache.expiry(this, userUid),
                          VipEntitlementCache.isAdmin(this, userUid)
                      )
                  }

                  user.getIdToken(true)
                      .addOnSuccessListener { token ->
                          val admin = token.claims["admin"] == true
                          isAdminAccount = admin
                          if (admin) {
                              vipMembershipStatus = "VIP+ AKTIF • ADMIN"
                              activateVerifiedVip(true, 0L, true)
                          } else {
                              FirebaseFirestore.getInstance()
                                  .collection("vip_members")
                                  .document(userUid)
                                  .get(com.google.firebase.firestore.Source.SERVER)
                                  .addOnSuccessListener { member ->
                                      val expiresAt = member.getTimestamp("expiresAt")?.toDate()?.time ?: 0L
                                      val active = member.getString("membershipStatus") == "ACTIVE" &&
                                          (expiresAt == 0L || expiresAt > System.currentTimeMillis())
                                      vipMembershipStatus = if (active) "VIP+ AKTIF" else "BELUM AKTIF"
                                      activateVerifiedVip(active, expiresAt, false)
                                  }
                                  .addOnFailureListener { useOfflineEntitlement() }
                          }
                      }
                      .addOnFailureListener { useOfflineEntitlement() }
              }
          }

