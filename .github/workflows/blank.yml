
name: Build M Launcher Voice

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - admob/restore
      - security/hardening

permissions:
  contents: read

jobs:
  security-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate VIP admin tool
        run: node --check admin-tools/vip-admin.js

      - name: Verify no private credentials are tracked
        shell: bash
        run: |
          set -euo pipefail
          if git log --all --name-only --pretty=format: | grep -Ei '(^|/)(service-account[^/]*\.json|[^/]*firebase-adminsdk[^/]*\.json|[^/]*\.(jks|keystore)|\.env$)' >/dev/null; then
            echo "Private credential file path detected in repository history."
            exit 1
          fi
          if git log --all -p -- . | grep -Ei -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|"private_key"[[:space:]]*:[[:space:]]*"-----BEGIN' >/dev/null; then
            echo "Private key material detected in repository history."
            exit 1
          fi

      - name: Resolve patched admin dependencies
        run: |
          # Rebuild the lock from exact direct dependencies and the patched uuid override.
          npm install --package-lock-only --ignore-scripts --prefix admin-tools
          npm ci --ignore-scripts --prefix admin-tools

      - name: Audit admin dependencies
        run: npm audit --prefix admin-tools --audit-level=moderate

      - name: Setup Node.js for Firestore rules tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'

      - name: Test Firestore Security Rules
        run: |
          npm install --prefix security-tests --no-audit --no-fund
          npm audit --prefix security-tests --audit-level=moderate
          security-tests/node_modules/.bin/firebase emulators:exec --only firestore --project demo-m-launcher-voice "node security-tests/firestore-rules.test.mjs"

  build:
    needs: security-checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.9'

      - name: Enable AndroidX
        run: |
          printf "android.useAndroidX=true\\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\\norg.gradle.workers.max=2\\n" > gradle.properties

      - name: Create Android Project
        run: |
          mkdir -p app/src/main/java/com/m/launchervoice

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "M-Launcher-Voice"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.2.0" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.2.0" apply false
              id("com.google.gms.google-services") version "4.6.0" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          if (file("google-services.json").exists()) {
              apply(plugin = "com.google.gms.google-services")
          }

          android {
              namespace = "com.m.launchervoice"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.m.launchervoice"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 35
                  versionName = "2.42"
              }

              signingConfigs {
                  create("release") {
                      storeFile = file(System.getenv("SIGNING_STORE_FILE"))
                      storePassword = System.getenv("SIGNING_STORE_PASSWORD")
                      keyAlias = System.getenv("SIGNING_KEY_ALIAS")
                      keyPassword = System.getenv("SIGNING_KEY_PASSWORD")
                  }
              }

              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.activity:activity-compose:1.10.0")
              implementation("androidx.fragment:fragment-ktx:1.8.5")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")

              implementation(platform("com.google.firebase:firebase-bom:35.2.0"))
              implementation("com.google.android.gms:play-services-auth:21.3.0")
              implementation("com.google.android.gms:play-services-ads:24.9.0")
              implementation("com.google.firebase:firebase-auth")
              implementation("com.google.firebase:firebase-firestore")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
